<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >
  <title>テニスコート空き状況</title>

  <link rel="stylesheet" href="availability.css?v=4">
</head>

<body>
  <main class="page">

    <header class="topbar">
      <a href="index.html" class="back">‹ 戻る</a>

      <div class="title-block">
        <h1>🎾 空き状況</h1>
        <p id="updatedAt">読み込み中...</p>
      </div>

      <button
        id="reloadButton"
        class="reload"
        type="button"
      >
        更新
      </button>
    </header>


    <a
      class="booking-button"
      href="https://www.shisetsu.city.yokohama.lg.jp/user/Home"
      target="_blank"
      rel="noopener noreferrer"
    >
      横浜市予約サイトを開く
    </a>


    <!--
      空き / 開放待ちは独立したON/OFFボタン
      初期状態は両方ON
    -->
    <section class="status-tabs">

      <button
        class="status-tab available active"
        data-status="available"
        type="button"
      >
        <span>空き</span>
        <strong id="availableCount">-</strong>
      </button>

      <button
        class="status-tab waiting active"
        data-status="waiting"
        type="button"
      >
        <span>開放待ち</span>
        <strong id="waitingCount">-</strong>
      </button>

    </section>


    <section class="filters">

      <select
        id="conditionFilter"
        aria-label="条件"
      >
        <option value="all">
          条件：すべて
        </option>
      </select>


      <select
        id="sourceFilter"
        aria-label="検索元"
      >
        <option value="all">
          検索元：すべて
        </option>

        <option value="yokohama">
          横浜市
        </option>

        <option value="e-kanagawa">
          保土ケ谷公園
        </option>
      </select>

    </section>


    <div
      id="warningBox"
      class="warning hidden"
    ></div>


    <div id="results"></div>


    <div
      id="emptyState"
      class="empty hidden"
    >
      該当する空き枠はありません。
    </div>

  </main>

<script src="availability.js?v=5" defer></script>

</body>
</html>
