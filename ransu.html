<script>
    // プルダウン初期化 (デフォルト5人)
    const playerSelect = document.getElementById('playerCount');
    for (let i = 4; i <= 20; i++) {
      const opt = document.createElement('option');
      opt.value = i; opt.innerText = `${i} 人`;
      if (i === 5) opt.selected = true;
      playerSelect.appendChild(opt);
    }

    let scheduleData = [];
    let activeMatchIndex = 0;
    let targetScoreInfo = null;

    // 平準化・ペア履歴用データ
    let playCounts = [];
    let restCounts = [];
    let roundsSinceLastRest = []; 
    let restPairMatrix = [];      
    let pairMatrix = [];          // ★追加: ペアを組んだ回数の記録

    function triggerVibration(ms = 15) {
      if ("vibrate" in navigator) navigator.vibrate(ms);
    }

    // 新規作成
    function startNewSchedule() {
      const numPlayers = parseInt(document.getElementById('playerCount').value);
      const numCourts = parseInt(document.getElementById('courtCount').value);
      if (numPlayers < numCourts * 4) {
        alert(`${numCourts}面でプレイするには最低 ${numCourts * 4}人 必要です。`);
        return;
      }

      scheduleData = [];
      activeMatchIndex = 0;
      playCounts = new Array(numPlayers + 1).fill(0);
      restCounts = new Array(numPlayers + 1).fill(0);
      roundsSinceLastRest = new Array(numPlayers + 1).fill(99);

      restPairMatrix = Array.from({ length: numPlayers + 1 }, () => new Array(numPlayers + 1).fill(0));
      pairMatrix = Array.from({ length: numPlayers + 1 }, () => new Array(numPlayers + 1).fill(0));

      generateRounds(8);
      document.getElementById('actionBar').style.display = 'flex';
    }

    function appendMoreRounds() {
      generateRounds(8);
    }

    function getCombinations(arr, k) {
      if (k === 0) return [[]];
      if (arr.length === 0) return [];
      const head = arr[0];
      const tail = arr.slice(1);
      const withHead = getCombinations(tail, k - 1).map(c => [head, ...c]);
      const withoutHead = getCombinations(tail, k);
      return [...withHead, ...withoutHead];
    }

    function shuffleArray(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    // 4人から最もペア重複が少ない「ペア1 vs ペア2」の組み合わせを決める
    function getBestCourtPairing(fourPlayers) {
      // 4人の分け方は 3パターン（ (0,1 vs 2,3), (0,2 vs 1,3), (0,3 vs 1,2) ）
      const patterns = [
        { p1: fourPlayers[0], p2: fourPlayers[1], p3: fourPlayers[2], p4: fourPlayers[3] },
        { p1: fourPlayers[0], p2: fourPlayers[2], p3: fourPlayers[1], p4: fourPlayers[3] },
        { p1: fourPlayers[0], p3: fourPlayers[3], p2: fourPlayers[1], p4: fourPlayers[2] }
      ];

      let bestPattern = null;
      let minScore = Infinity;

      patterns.forEach(pt => {
        // ペアを組んだ回数が少ないほどスコアが低い（優先される）
        const pair1Count = pairMatrix[pt.p1][pt.p2];
        const pair2Count = pairMatrix[pt.p3][pt.p4];
        
        // 重みを大きくしてペア被りを徹底回避
        let score = (pair1Count * 100) + (pair2Count * 100) + (Math.random() * 5);

        if (score < minScore) {
          minScore = score;
          bestPattern = pt;
        }
      });

      return bestPattern;
    }

    // 試合生成ロジック
    function generateRounds(count) {
      triggerVibration(20);
      const numPlayers = parseInt(document.getElementById('playerCount').value);
      const numCourts = parseInt(document.getElementById('courtCount').value);
      const playersPerRound = numCourts * 4;
      const numResting = numPlayers - playersPerRound;

      for (let r = 0; r < count; r++) {
        const currentRoundNum = scheduleData.length + 1;
        let restedThisRound = [];
        let playingThisRound = [];

        if (currentRoundNum === 1) {
          // 第1試合：1~4が出場（1・2 vs 3・4）
          playingThisRound = Array.from({ length: playersPerRound }, (_, i) => i + 1);
          for (let p = playersPerRound + 1; p <= numPlayers; p++) {
            restedThisRound.push(p);
          }
        } else {
          // 第2試合以降：休みを選出
          if (numResting === 0) {
            restedThisRound = [];
          } else {
            let allPlayers = Array.from({ length: numPlayers }, (_, i) => i + 1);
            let allCombos = getCombinations(allPlayers, numResting);
            let comboScores = [];

            allCombos.forEach(combo => {
              let score = 0;
              let invalid = false;

              // ① 2連続休みの防止
              combo.forEach(p => {
                if (roundsSinceLastRest[p] === 0) invalid = true;
              });

              if (invalid) return;

              // ② 出場機会の平準化
              combo.forEach(p => {
                score += roundsSinceLastRest[p] * 120;
                score -= restCounts[p] * 40;
              });

              // ③ 休みペアの重複禁止ペナルティ
              for (let i = 0; i < combo.length; i++) {
                for (let j = i + 1; j < combo.length; j++) {
                  let p1 = combo[i];
                  let p2 = combo[j];
                  score -= restPairMatrix[p1][p2] * 250;
                }
              }

              score += Math.random() * 30;
              comboScores.push({ combo, score });
            });

            if (comboScores.length > 0) {
              comboScores.sort((a, b) => b.score - a.score);
              restedThisRound = comboScores[0].combo;
            } else {
              let candidates = allPlayers.filter(p => roundsSinceLastRest[p] > 0);
              shuffleArray(candidates);
              restedThisRound = candidates.slice(0, numResting);
            }
          }

          playingThisRound = Array.from({ length: numPlayers }, (_, i) => i + 1)
                                  .filter(p => !restedThisRound.includes(p));
        }

        // 状態更新
        for (let p = 1; p <= numPlayers; p++) {
          if (restedThisRound.includes(p)) {
            restCounts[p]++;
            roundsSinceLastRest[p] = 0;
          } else {
            playCounts[p]++;
            roundsSinceLastRest[p]++;
          }
        }

        // 休みペア記録
        for (let i = 0; i < restedThisRound.length; i++) {
          for (let j = i + 1; j < restedThisRound.length; j++) {
            let p1 = restedThisRound[i];
            let p2 = restedThisRound[j];
            restPairMatrix[p1][p2]++;
            restPairMatrix[p2][p1]++;
          }
        }

        // コート割り当て & 最適ペアリングの計算
        let courts = [];
        let remainingPlaying = [...playingThisRound];

        for (let c = 0; c < numCourts; c++) {
          let four = remainingPlaying.splice(0, 4);
          let match = null;

          if (currentRoundNum === 1 && c === 0) {
            // 第1試合のAコートは 1・2 vs 3・4 に固定
            match = { p1: four[0], p2: four[1], p3: four[2], p4: four[3] };
          } else {
            // 過去のペア履歴から最も新鮮なペアの組み方を選択！
            match = getBestCourtPairing(four);
          }

          // ペア履歴（pairMatrix）の更新
          pairMatrix[match.p1][match.p2]++;
          pairMatrix[match.p2][match.p1]++;
          pairMatrix[match.p3][match.p4]++;
          pairMatrix[match.p4][match.p3]++;

          courts.push({
            courtNum: String.fromCharCode(65 + c),
            p1: match.p1, p2: match.p2, p3: match.p3, p4: match.p4,
            scoreA: '-', scoreB: '-'
          });
        }

        scheduleData.push({
          round: currentRoundNum,
          courts: courts,
          rest: restedThisRound.sort((a, b) => a - b)
        });
      }

      renderSchedule();
    }

    // 画面描画
    function renderSchedule() {
      const container = document.getElementById('scheduleContainer');
      container.innerHTML = '';

      scheduleData.forEach((rd, rIdx) => {
        const card = document.createElement('div');
        card.className = `match-card ${rIdx === activeMatchIndex ? 'active' : ''}`;
        
        let courtHtml = '';
        rd.courts.forEach((c, cIdx) => {
          courtHtml += `
            <div class="court-box" onclick="handleTap(${rIdx}, ${cIdx})">
              <span class="court-name">${c.courtNum}コート</span>
              <span class="match-pair">${c.p1}・${c.p2} vs ${c.p3}・${c.p4}</span>
              <span class="score-display">${c.scoreA} - ${c.scoreB}</span>
            </div>
          `;
        });

        let restText = rd.rest.length > 0 ? `休: ${rd.rest.join(', ')}` : '休みなし';

        card.innerHTML = `
          <div class="match-header" onclick="setActiveMatch(${rIdx})">
            <span>第 ${rd.round} 試合</span>
            ${rIdx === activeMatchIndex ? '<span class="active-badge">進行中</span>' : ''}
          </div>
          <div class="court-grid">${courtHtml}</div>
          <div class="rest-box">${restText}</div>
        `;
        container.appendChild(card);
      });
    }

    function setActiveMatch(rIdx) {
      triggerVibration(10);
      activeMatchIndex = rIdx;
      renderSchedule();
    }

    let lastTapTime = 0;
    let lastTapTarget = null;

    function handleTap(rIdx, cIdx) {
      const now = new Date().getTime();
      const targetId = `${rIdx}-${cIdx}`;

      if (now - lastTapTime < 300 && lastTapTarget === targetId) {
        openScoreModal(rIdx, cIdx);
      } else {
        setActiveMatch(rIdx);
      }
      lastTapTime = now;
      lastTapTarget = targetId;
    }

    function openScoreModal(rIdx, cIdx) {
      triggerVibration(20);
      targetScoreInfo = { rIdx, cIdx };
      const court = scheduleData[rIdx].courts[cIdx];

      document.getElementById('modalTitle').innerText = `第${rIdx+1}試合 (${court.courtNum}コート)`;
      document.getElementById('modalPair').innerText = `${court.p1}・${court.p2} vs ${court.p3}・${court.p4}`;

      const scoreASelect = document.getElementById('scoreA');
      const scoreBSelect = document.getElementById('scoreB');
      scoreASelect.innerHTML = ''; scoreBSelect.innerHTML = '';

      for (let i = 0; i <= 7; i++) {
        scoreASelect.add(new Option(i, i));
        scoreBSelect.add(new Option(i, i));
      }

      scoreASelect.value = court.scoreA !== '-' ? court.scoreA : 0;
      scoreBSelect.value = court.scoreB !== '-' ? court.scoreB : 0;

      document.getElementById('scoreModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('scoreModal').style.display = 'none';
    }

    function saveScore() {
      triggerVibration(15);
      if (targetScoreInfo) {
        const { rIdx, cIdx } = targetScoreInfo;
        scheduleData[rIdx].courts[cIdx].scoreA = document.getElementById('scoreA').value;
        scheduleData[rIdx].courts[cIdx].scoreB = document.getElementById('scoreB').value;
        renderSchedule();
      }
      closeModal();
    }

    function copyScheduleText() {
      triggerVibration(15);
      let text = "🎾【テニス乱数表】\n\n";

      scheduleData.forEach(rd => {
        text += `■ 第${rd.round}試合\n`;
        rd.courts.forEach(c => {
          let score = (c.scoreA !== '-') ? ` (${c.scoreA}-${c.scoreB})` : '';
          text += ` ${c.courtNum}: ${c.p1}・${c.p2} vs ${c.p3}・${c.p4}${score}\n`;
        });
        if (rd.rest.length > 0) text += ` 休: ${rd.rest.join(', ')}\n`;
        text += "\n";
      });

      navigator.clipboard.writeText(text).then(() => {
        alert("LINE用の共有テキストをコピーしました！");
      }).catch(() => {
        alert("コピーに失敗しました");
      });
    }
  </script>
