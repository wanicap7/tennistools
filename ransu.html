<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>テニスダブルス乱数表ジェネレーター</title>
  <style>
    :root {
      --primary-color: #2e7d32;
      --primary-hover: #1b5e20;
      --bg-color: #f4f6f8;
      --card-bg: #ffffff;
      --text-color: #333333;
      --accent-color: #e65100;
      --border-color: #e0e0e0;
      --selected-border: #4caf50;
      --selected-bg: #f1f8e9;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      user-select: none;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 12px;
      max-width: 600px;
      margin: 0 auto;
      padding-bottom: 40px;
    }

    h1 {
      text-align: center;
      font-size: 1.4rem;
      margin-bottom: 16px;
      color: var(--primary-color);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      border: 1px solid var(--border-color);
    }

    .setting-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 16px;
    }

    label {
      font-size: 0.85rem;
      font-weight: bold;
      color: #555;
      display: block;
      margin-bottom: 6px;
    }

    select {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 1rem;
      background-color: #fafafa;
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
    }

    button:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background-color: var(--primary-color);
      color: white;
    }

    .btn-primary:hover {
      background-color: var(--primary-hover);
    }

    .btn-secondary {
      background-color: #0288d1;
      color: white;
    }

    .btn-secondary:hover {
      background-color: #01579b;
    }

    .btn-copy {
      background-color: #ff9800;
      color: white;
      margin-top: 8px;
    }

    .match-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
      border-left: 5px solid var(--primary-color);
      border-right: 2px solid transparent;
      border-top: 2px solid transparent;
      border-bottom: 2px solid transparent;
      box-shadow: 0 2px 6px rgba(0,0,0,0.04);
      cursor: pointer;
      transition: all 0.2s ease;
      touch-action: manipulation;
    }

    .match-card.selected {
      background-color: var(--selected-bg);
      border-color: var(--selected-border);
      border-left-width: 6px;
      box-shadow: 0 4px 12px rgba(76, 175, 80, 0.25);
    }

    .match-header {
      font-weight: bold;
      font-size: 1.05rem;
      margin-bottom: 8px;
      color: var(--primary-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #f0f0f0;
      padding-bottom: 4px;
    }

    .match-hint {
      font-size: 0.72rem;
      color: #888;
      font-weight: normal;
    }

    .court-container {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 8px;
    }

    .court-box {
      background-color: #f9fbe7;
      border: 1px solid #c0ca33;
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 0.95rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .court-info {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 4px;
    }

    .court-name {
      font-weight: bold;
      color: #33691e;
      margin-right: 4px;
    }

    .vs-text {
      color: #d32f2f;
      font-weight: bold;
      margin: 0 4px;
    }

    .player-tag {
      display: inline-block;
      background: #e8f5e9;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 500;
    }

    .score-badge {
      background: #333;
      color: #fff;
      font-weight: bold;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 0.85rem;
    }

    .rest-box {
      background-color: #fff3e0;
      border: 1px solid #ffe0b2;
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 0.88rem;
      color: var(--accent-color);
      font-weight: bold;
    }

    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 2000;
    }

    .modal-content {
      background: white;
      border-radius: 12px;
      padding: 20px;
      width: 90%;
      max-width: 400px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    }

    .modal-title {
      font-weight: bold;
      font-size: 1.1rem;
      margin-bottom: 12px;
      color: var(--primary-color);
    }

    .score-input-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 16px;
    }

    .score-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #f5f5f5;
      padding: 8px 12px;
      border-radius: 8px;
    }

    .score-inputs {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .score-inputs input {
      width: 45px;
      height: 38px;
      text-align: center;
      font-size: 1.1rem;
      border: 1px solid var(--border-color);
      border-radius: 6px;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
    }

    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.8);
      color: white;
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 0.9rem;
      display: none;
      z-index: 3000;
    }
  </style>
</head>
<body>

  <h1>🎾 テニス乱数表ジェネレーター</h1>

  <div class="card">
    <div class="setting-group">
      <div>
        <label for="playerCount">参加人数</label>
        <select id="playerCount" onchange="autoAdjustCourt()">
          <option value="5">5人</option>
          <option value="6" selected>6人</option>
          <option value="7">7人</option>
          <option value="8">8人</option>
          <option value="9">9人</option>
          <option value="10">10人</option>
          <option value="11">11人</option>
          <option value="12">12人</option>
        </select>
      </div>
      <div>
        <label for="courtCount">コート数</label>
        <select id="courtCount">
          <option value="1">1面</option>
          <option value="2">2面</option>
        </select>
      </div>
    </div>

    <div class="btn-group">
      <button class="btn-primary" onclick="generateNewSchedule()">乱数表を作成</button>
      <button id="btnCopy" class="btn-copy" onclick="copyToClipboard()" disabled>LINE用にテキストコピー</button>
    </div>
  </div>

  <div id="matchesContainer"></div>

  <!-- スコア入力Modal -->
  <div id="scoreModal" class="modal-overlay">
    <div class="modal-content">
      <div id="modalTitle" class="modal-title">スコア入力</div>
      <div id="modalScoreInputs" class="score-input-group"></div>
      <div class="modal-actions">
        <button class="btn-secondary" onclick="saveScores()">保存</button>
        <button style="background:#e0e0e0; color:#333;" onclick="closeScoreModal()">キャンセル</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast">クリップボードにコピーしました！</div>

  <script>
	// 5人1面：黄金固定テーブル
const GOLDEN_TABLE_5P = [
      { pair1: [1, 2], pair2: [3, 4], rest: [5] },
      { pair1: [1, 3], pair2: [2, 5], rest: [4] },
      { pair1: [2, 3], pair2: [4, 5], rest: [1] },
      { pair1: [1, 4], pair2: [3, 5], rest: [2] },
      { pair1: [1, 5], pair2: [2, 4], rest: [3] },
      { pair1: [1, 3], pair2: [2, 4], rest: [5] },
      { pair1: [1, 2], pair2: [3, 5], rest: [4] },
      { pair1: [2, 4], pair2: [3, 5], rest: [1] },
      { pair1: [1, 3], pair2: [4, 5], rest: [2] },
      { pair1: [1, 4], pair2: [2, 5], rest: [3] },
      { pair1: [1, 4], pair2: [2, 3], rest: [5] },
      { pair1: [1, 5], pair2: [2, 3], rest: [4] },
      { pair1: [2, 5], pair2: [3, 4], rest: [1] },
      { pair1: [1, 5], pair2: [3, 4], rest: [2] },
      { pair1: [1, 2], pair2: [4, 5], rest: [3] }
    ];

    // 6人1面：ご提示いただいた新しい15試合の対戦表に更新（休みは自動算出）
    const GOLDEN_TABLE_6P = [
      { pair1: [1, 2], pair2: [3, 4], rest: [5, 6] },
      { pair1: [2, 4], pair2: [5, 6], rest: [1, 3] },
      { pair1: [1, 6], pair2: [3, 4], rest: [2, 5] },
      { pair1: [1, 5], pair2: [2, 6], rest: [3, 4] },
      { pair1: [2, 3], pair2: [4, 5], rest: [1, 6] },
      { pair1: [1, 2], pair2: [3, 6], rest: [4, 5] },
      { pair1: [1, 4], pair2: [5, 6], rest: [2, 3] },
      { pair1: [2, 4], pair2: [3, 6], rest: [1, 5] },
      { pair1: [1, 3], pair2: [2, 5], rest: [4, 6] },
      { pair1: [3, 5], pair2: [4, 6], rest: [1, 2] },
      { pair1: [1, 6], pair2: [2, 5], rest: [3, 4] },
      { pair1: [1, 4], pair2: [2, 3], rest: [5, 6] },
      { pair1: [3, 4], pair2: [5, 6], rest: [1, 2] },
      { pair1: [1, 5], pair2: [2, 6], rest: [3, 4] },
      { pair1: [1, 3], pair2: [4, 5], rest: [2, 6] }
    ];

    let baseMatches = [];
    let selectedIndex = null;
    let lastTapTime = 0;
    let lastTapMatchIdx = null;

    const MAX_BASE_MATCHES = 15;

    function autoAdjustCourt() {
      const pCount = parseInt(document.getElementById('playerCount').value, 10);
      const courtSelect = document.getElementById('courtCount');
      if (pCount >= 8) {
        courtSelect.value = '2';
      } else {
        courtSelect.value = '1';
      }
    }

    function generateNewSchedule() {
      const pCount = parseInt(document.getElementById('playerCount').value, 10);
      const cCount = parseInt(document.getElementById('courtCount').value, 10);

      if (cCount === 1 && pCount === 5) {
        loadFixedTable(GOLDEN_TABLE_5P);
      } else if (cCount === 1 && pCount === 6) {
        loadFixedTable(GOLDEN_TABLE_6P);
      } else {
        generateCalculatedSchedule(pCount, cCount);
      }

      document.getElementById('btnCopy').disabled = false;
      renderUI();
    }

    function loadFixedTable(tableData) {
      baseMatches = tableData.map((m) => ({
        courts: [{ pair1: [...m.pair1], pair2: [...m.pair2], score1: '', score2: '' }],
        rests: [...m.rest]
      }));
    }

    function generateCalculatedSchedule(numPlayers, numCourts) {
      const activePerMatch = numCourts * 4;

      if (numPlayers < activePerMatch) {
        alert(`コート${numCourts}面（${activePerMatch}人必要）に対して人数（${numPlayers}人）が不足しています。`);
        return;
      }

      let playCounts = Array(numPlayers + 1).fill(0);
      let pairCounts = {};
      let prevPlaying = new Set();
      baseMatches = [];

      function getPairKey(a, b) {
        return a < b ? `${a}-${b}` : `${b}-${a}`;
      }

      for (let m = 0; m < MAX_BASE_MATCHES; m++) {
        let players = Array.from({ length: numPlayers }, (_, i) => i + 1);

        players.sort((a, b) => {
          if (playCounts[a] !== playCounts[b]) return playCounts[a] - playCounts[b];
          let aPrev = prevPlaying.has(a) ? 1 : 0;
          let bPrev = prevPlaying.has(b) ? 1 : 0;
          if (aPrev !== bPrev) return aPrev - bPrev;
          return Math.random() - 0.5;
        });

        let selected = players.slice(0, activePerMatch);
        let currentRests = players.slice(activePerMatch).sort((a, b) => a - b);

        let matchCourts = [];

        for (let c = 0; c < numCourts; c++) {
          let bestCombination = null;
          let minScore = Infinity;

          let p = selected.slice(c * 4, c * 4 + 4);
          let combos = [
            { p1: [p[0], p[1]], p2: [p[2], p[3]] },
            { p1: [p[0], p[2]], p2: [p[1], p[3]] },
            { p1: [p[0], p[3]], p2: [p[1], p[2]] }
          ];

          combos.forEach((cb) => {
            let k1 = getPairKey(cb.p1[0], cb.p1[1]);
            let k2 = getPairKey(cb.p2[0], cb.p2[1]);
            let score = (pairCounts[k1] || 0) + (pairCounts[k2] || 0);
            if (score < minScore) {
              minScore = score;
              bestCombination = cb;
            }
          });

          let k1 = getPairKey(bestCombination.p1[0], bestCombination.p1[1]);
          let k2 = getPairKey(bestCombination.p2[0], bestCombination.p2[1]);
          pairCounts[k1] = (pairCounts[k1] || 0) + 1;
          pairCounts[k2] = (pairCounts[k2] || 0) + 1;

          matchCourts.push({
            pair1: bestCombination.p1,
            pair2: bestCombination.p2,
            score1: '',
            score2: ''
          });
        }

        selected.forEach((p) => playCounts[p]++);
        prevPlaying = new Set(selected);

        baseMatches.push({
          courts: matchCourts,
          rests: currentRests
        });
      }
    }

    function renderUI() {
      const container = document.getElementById('matchesContainer');
      container.innerHTML = '';

      baseMatches.forEach((match, idx) => {
        const card = document.createElement('div');
        card.className = `match-card ${selectedIndex === idx ? 'selected' : ''}`;

        card.addEventListener('click', () => handleMatchCardClick(idx));

        let html = `<div class="match-header">
                      <span>第 ${idx + 1} 試合</span>
                      <span class="match-hint">ダブルタップでスコア</span>
                    </div>`;

        html += `<div class="court-container">`;
        match.courts.forEach((c, cIdx) => {
          let scoreText = '';
          if (c.score1 !== undefined && c.score2 !== undefined && c.score1 !== '' && c.score2 !== '') {
            scoreText = `<span class="score-badge">${c.score1} - ${c.score2}</span>`;
          }

          let courtLabel = match.courts.length > 1 ? `面${cIdx + 1}:` : 'コート:';

          html += `<div class="court-box">
                    <div class="court-info">
                      <span class="court-name">${courtLabel}</span>
                      <span class="player-tag">${c.pair1[0]}・${c.pair1[1]}</span>
                      <span class="vs-text">vs</span>
                      <span class="player-tag">${c.pair2[0]}・${c.pair2[1]}</span>
                    </div>
                    ${scoreText}
                   </div>`;
        });
        html += `</div>`;

        if (match.rests.length > 0) {
          html += `<div class="rest-box">休: ${match.rests.join(', ')}</div>`;
        }

        card.innerHTML = html;
        container.appendChild(card);
      });
    }

    function handleMatchCardClick(idx) {
      const currentTime = new Date().getTime();
      const tapLength = currentTime - lastTapTime;

      selectedIndex = (selectedIndex === idx) ? null : idx;
      renderUI();

      if (lastTapMatchIdx === idx && tapLength < 300 && tapLength > 0) {
        openScoreModal(idx);
      }

      lastTapTime = currentTime;
      lastTapMatchIdx = idx;
    }

    let activeModalMatchIdx = null;

    function openScoreModal(idx) {
      activeModalMatchIdx = idx;
      const match = baseMatches[idx];
      document.getElementById('modalTitle').textContent = `第 ${idx + 1} 試合 スコア入力`;

      const inputsContainer = document.getElementById('modalScoreInputs');
      inputsContainer.innerHTML = '';

      match.courts.forEach((c, cIdx) => {
        const row = document.createElement('div');
        row.className = 'score-row';
        let labelText = match.courts.length > 1 ? `コート ${cIdx + 1}` : 'コート';
        row.innerHTML = `
          <span style="font-weight:bold; font-size:0.85rem;">${labelText}</span>
          <div class="score-inputs">
            <span style="font-size:0.85rem;">${c.pair1[0]}・${c.pair1[1]}</span>
            <input type="number" id="score_1_${cIdx}" value="${c.score1 !== undefined ? c.score1 : ''}" min="0" max="99">
            <span>-</span>
            <input type="number" id="score_2_${cIdx}" value="${c.score2 !== undefined ? c.score2 : ''}" min="0" max="99">
            <span style="font-size:0.85rem;">${c.pair2[0]}・${c.pair2[1]}</span>
          </div>
        `;
        inputsContainer.appendChild(row);
      });

      document.getElementById('scoreModal').style.display = 'flex';
    }

    function closeScoreModal() {
      document.getElementById('scoreModal').style.display = 'none';
      activeModalMatchIdx = null;
    }

    function saveScores() {
      if (activeModalMatchIdx === null) return;

      const match = baseMatches[activeModalMatchIdx];
      match.courts.forEach((c, cIdx) => {
        const s1 = document.getElementById(`score_1_${cIdx}`).value;
        const s2 = document.getElementById(`score_2_${cIdx}`).value;
        c.score1 = s1;
        c.score2 = s2;
      });

      closeScoreModal();
      renderUI();
    }

    function copyToClipboard() {
      let text = `🎾【テニス乱数表】\n\n`;

      baseMatches.forEach((match, idx) => {
        text += `■ 第${idx + 1}試合\n`;
        match.courts.forEach((c, cIdx) => {
          let courtPrefix = match.courts.length > 1 ? `[面${cIdx + 1}] ` : '';
          let scoreStr = '';
          if (c.score1 !== undefined && c.score2 !== undefined && c.score1 !== '' && c.score2 !== '') {
            scoreStr = ` [${c.score1}-${c.score2}]`;
          }
          text += `${courtPrefix}${c.pair1[0]}・${c.pair1[1]} vs ${c.pair2[0]}・${c.pair2[1]}${scoreStr}\n`;
        });
        if (match.rests.length > 0) {
          text += ` 休: ${match.rests.join(', ')}\n`;
        }
        text += `\n`;
      });

      navigator.clipboard.writeText(text.trim()).then(() => {
        showToast();
      }).catch(err => {
        console.error('Copy failed', err);
      });
    }

    function showToast() {
      const toast = document.getElementById('toast');
      toast.style.display = 'block';
      setTimeout(() => {
        toast.style.display = 'none';
      }, 2000);
    }
  </script>
</body>
</html>
