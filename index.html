<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>テニス ポータル</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 20px 16px;
      background-color: #f2f2f7;
      color: #1c1c1e;
      touch-action: manipulation;
    }
    
    .header {
      text-align: center;
      margin-bottom: 24px;
      margin-top: 10px;
    }
    .header h1 {
      font-size: 22px;
      margin: 0 0 6px 0;
    }
    .header p {
      font-size: 13px;
      color: #8e8e93;
      margin: 0;
    }

    .card-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
      max-width: 400px;
      margin: 0 auto;
    }

    .app-card {
      background: white;
      border-radius: 14px;
      padding: 18px 16px;
      text-decoration: none;
      color: inherit;
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: transform 0.1s ease, background-color 0.1s ease;
    }

    .app-card:active {
      transform: scale(0.98);
      background-color: #f9f9fb;
    }

    .card-info {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .card-icon {
      font-size: 28px;
      line-height: 1;
    }

    .card-text {
      display: flex;
      flex-direction: column;
    }

    .card-title {
      font-size: 16px;
      font-weight: bold;
      color: #000;
      margin-bottom: 2px;
    }

    .card-desc {
      font-size: 12px;
      color: #666;
    }

    .chevron {
      color: #c7c7cc;
      font-size: 18px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>🎾 テニスツール集</h1>
    <p>メニューを選択してください</p>
  </div>

  <div class="card-list">
    <!-- 乱数表ジェネレーター -->
    <a href="ransu.html" class="app-card">
      <div class="card-info">
        <span class="card-icon">📋</span>
        <div class="card-text">
          <span class="card-title">乱数表ジェネレーター</span>
          <span class="card-desc">組み合わせ作成・スコア記録・LINE共有</span>
        </div>
      </div>
      <span class="chevron">›</span>
    </a>

    <!-- スペインドリル (イン/アウト記録) -->
    <a href="spain.html" class="app-card">
      <div class="card-info">
        <span class="card-icon">🎯</span>
        <div class="card-text">
          <span class="card-title">スペインドリル記録</span>
          <span class="card-desc">フォア/バックのイン・アウト集計</span>
        </div>
      </div>
      <span class="chevron">›</span>
    </a>
  </div>

</body>
</html>
