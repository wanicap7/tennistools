<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>テニススタッツ計測ツール</title>

<style>
:root{
  --primary:#2563eb;
  --bg:#f8fafc;
  --card:#ffffff;
  --text:#1e293b;
  --border:#e2e8f0;
}

*{
  box-sizing:border-box;
}

body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:var(--bg);
  color:var(--text);
  margin:0;
  padding:12px;
}

.container{
  max-width:850px;
  margin:0 auto;
}

.card{
  background:var(--card);
  border-radius:8px;
  padding:16px;
  margin-bottom:12px;
  border:1px solid var(--border);
  box-shadow:0 1px 3px rgba(0,0,0,.05);
}

h2,h3{
  margin-top:0;
  margin-bottom:12px;
  text-align:center;
}

button{
  padding:12px 8px;
  font-size:.95rem;
  font-weight:bold;
  border-radius:6px;
  border:1px solid #cbd5e1;
  background:#f1f5f9;
  color:var(--text);
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
  -webkit-user-select:none;
  user-select:none;
  transition:transform .045s ease, filter .045s ease, box-shadow .045s ease;
  will-change:transform;
}

button:active,
button.is-pressing{
  transform:scale(.965);
  filter:brightness(.94);
  box-shadow:inset 0 1px 3px rgba(15,23,42,.18);
}

button.selected{
  background:var(--primary)!important;
  color:#fff!important;
  border-color:var(--primary)!important;
}

button.action-btn{
  background:#fff;
  border:2px solid #cbd5e1;
}

button.fault-btn{
  background:#fef3c7;
  border-color:#f59e0b;
  color:#b45309;
  grid-column:span 2;
}

button:disabled{
  opacity:.4;
  cursor:not-allowed;
  transform:none!important;
}

.btn-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
  margin-bottom:8px;
}

.btn-grid-4{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:6px;
}

.btn-grid-2{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
}

input[type=text],
input[type=date],
select{
  width:100%;
  padding:9px;
  margin-bottom:8px;
  border:1px solid var(--border);
  border-radius:4px;
}

.scoreboard{
  background:#0f172a;
  color:#fff;
  padding:12px;
  border-radius:8px;
  text-align:center;
}

.match-date{
  font-size:.85rem;
  color:#38bdf8;
  margin-bottom:4px;
}

.score-sets{
  font-size:1.05rem;
  color:#94a3b8;
  margin-bottom:4px;
}

.score-main{
  font-size:2rem;
  font-weight:bold;
  letter-spacing:2px;
  color:#38bdf8;
}

.serve-status{
  font-size:.9rem;
  margin-top:4px;
  color:#fde047;
}

.toggle-container{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin:6px 0;
  font-size:.9rem;
}

.hidden{
  display:none!important;
}

.log-table-container{
  overflow-x:auto;
  margin-bottom:8px;
  -webkit-overflow-scrolling:touch;
}

table{
  width:100%;
  border-collapse:collapse;
  font-size:.8rem;
  text-align:center;
}

th,td{
  border:1px solid var(--border);
  padding:6px 4px;
  background:#fff;
}

th{
  background:#f1f5f9;
}

.log-table{
  min-width:600px;
}

.log-table th,
.log-table td{
  white-space:nowrap;
  min-width:55px;
}

.log-table th.col-game,
.log-table td.col-game{
  position:sticky;
  left:0;
  background:#f1f5f9;
  z-index:10;
  width:100px;
  min-width:100px;
  font-weight:bold;
}

.log-table th.col-team,
.log-table td.col-team{
  position:sticky;
  left:100px;
  background:#f1f5f9;
  z-index:10;
  width:90px;
  min-width:90px;
  font-weight:bold;
}

.log-table tbody tr td.col-game,
.log-table tbody tr td.col-team{
  background:#f8fafc;
}

.stats-wrap{
  overflow-x:auto;
  -webkit-overflow-scrolling:touch;
}

#stats-table{
  min-width:600px;
}

.modal{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,.6);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:100;
}

.modal-content{
  background:#fff;
  padding:20px;
  border-radius:8px;
  max-width:400px;
  width:90%;
}

.top-actions{
  display:flex;
  gap:6px;
}

.undo-btn{
  background:#fff;
  border:2px solid #94a3b8;
}

.save-btn{
  background:var(--primary);
  color:#fff;
  border-color:var(--primary);
}

@media(max-width:600px){

  body{
    padding:8px;
  }

  .card{
    padding:12px;
  }

  .btn-grid-4{
    grid-template-columns:repeat(2,1fr);
  }

  button{
    min-height:48px;
  }

  .score-main{
    font-size:1.8rem;
  }
}


/* 画像出力用 */
.export-actions{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
}

.exporting .no-export{
  display:none!important;
}

.exporting .log-table-container,
.exporting .stats-wrap{
  overflow:visible!important;
}

.exporting .log-table,
.exporting #stats-table{
  min-width:0!important;
  width:100%!important;
}

.exporting .log-table th.col-game,
.exporting .log-table td.col-game,
.exporting .log-table th.col-team,
.exporting .log-table td.col-team{
  position:static!important;
}

@media(max-width:600px){
  .export-actions{
    width:100%;
  }
  .export-actions button{
    flex:1 1 0;
    min-width:0;
  }
}

@media print{

  body{
    background:#fff;
    padding:0;
  }

  .no-print{
    display:none!important;
  }

  .card{
    border:none;
    box-shadow:none;
    padding:4px;
    margin-bottom:8px;
  }

  .scoreboard{
    background:#000!important;
    color:#fff!important;
    -webkit-print-color-adjust:exact;
    print-color-adjust:exact;
  }
}
</style>
</head>

<body>

<div class="container">

<!-- =========================
     初期設定
========================= -->

<div id="setup-screen" class="card">

<h2>試合初期設定</h2>

<label>試合日</label>
<input type="date" id="match-date-input">

<div style="display:flex;gap:8px">

<div style="flex:1">
<label>ペアA チーム名</label>
<input type="text" id="teamA-name" value="ペアA">
</div>

<div style="flex:1">
<label>ペアB チーム名</label>
<input type="text" id="teamB-name" value="ペアB">
</div>

</div>

<label>ペアA 選手</label>

<div style="display:flex;gap:8px">

<input type="text" id="pA1" value="選手A">
<input type="text" id="pA2" value="選手a">

</div>

<label>ペアB 選手</label>

<div style="display:flex;gap:8px">

<input type="text" id="pB1" value="選手B">
<input type="text" id="pB2" value="選手b">

</div>

<label>ルール</label>

<select id="rule-select">

<option value="6noadd">
6ゲーム先取 (ノーアド)
</option>

<option value="6semiadd">
6ゲーム先取 (セミアド)
</option>

<option value="1set">
1セットマッチ (6-6タイブレーク)
</option>

</select>

<label>第1ゲーム サーバー</label>

<select id="first-server"></select>

<div class="card"
style="margin-top:12px;background:#f8fafc">

<label style="font-weight:bold">
計測モード
</label>

<div style="display:flex;flex-direction:column;gap:6px">

<label>
<input type="radio"
name="mode-type"
value="simple"
checked>
シンプルモード（ペア単位）
</label>

<label>
<input type="radio"
name="mode-type"
value="player">
選手別モード
</label>

<label>
<input type="radio"
name="mode-type"
value="detail">
詳細モード（選手＋フォア/バック）
</label>

</div>
</div>

<button
style="width:100%;background:var(--primary);color:#fff"
onclick="startGame()">

試合開始

</button>

</div>


<!-- =========================
     試合画面
========================= -->

<div id="match-screen" class="hidden">

<div class="card scoreboard">

<div class="match-date"
id="display-match-date">
</div>

<div class="score-sets"
id="game-score">
ゲームスコア: 0 - 0
</div>

<div class="score-main"
id="point-score">
0 - 0
</div>

<div class="serve-status"
id="serve-info">
サーバー: -
</div>

</div>


<!-- 操作 -->

<div class="no-print">

<div class="card">

<div class="top-actions">

<button
class="undo-btn"
id="undo-btn"
onclick="undoLastAction()"
style="flex:1">

↩ 1つ戻る

</button>

</div>

</div>


<!-- 打点 -->

<div id="detail-card"
class="card hidden">

<div style="font-weight:bold;margin-bottom:8px">
打点選択
</div>

<div class="btn-grid">

<button
id="btn-fore"
onclick="selectSide('フォア')">
フォア
</button>

<button
id="btn-back"
onclick="selectSide('バック')">
バック
</button>

</div>

</div>


<!-- プレイヤー選択 -->

<div class="card">

<div
style="font-size:.8rem;color:#64748b;margin-bottom:4px"
id="selector-label">

1. ポイントに関与した選択

</div>

<div id="selector-container"></div>

</div>


<!-- アクション -->

<div class="card">

<div
style="font-size:.8rem;color:#64748b;margin-bottom:4px">

2. アクション

</div>

<div class="btn-grid">

<button
class="fault-btn"
id="btn-fault"
onclick="handleFault()">

フォルト

</button>

<button
class="action-btn"
id="btn-ace"
onclick="recordPoint('サービスエース')">

サービスエース

</button>

<button
class="action-btn"
id="btn-df"
onclick="recordPoint('ダブルフォルト')">

ダブルフォルト

</button>

<button
class="action-btn"
id="btn-strokeW"
onclick="recordPoint('ストロークウィナー')">

ストロークウィナー

</button>

<button
class="action-btn"
id="btn-strokeE"
onclick="recordPoint('ストロークエラー')">

ストロークエラー

</button>

<button
class="action-btn"
id="btn-volleyW"
onclick="recordPoint('ボレーウィナー')">

ボレーウィナー

</button>

<button
class="action-btn"
id="btn-volleyE"
onclick="recordPoint('ボレーエラー')">

ボレーエラー

</button>

<button
class="action-btn"
id="btn-returnW"
onclick="recordPoint('リターンエース')">

リターンエース

</button>

<button
class="action-btn"
id="btn-returnE"
onclick="recordPoint('リターンエラー')">

リターンエラー

</button>

</div>

</div>

</div>


<!-- =========================
     ログ
========================= -->

<div class="card" id="game-log-card">

<div style="
display:flex;
justify-content:space-between;
align-items:center;
gap:8px;
margin-bottom:8px;
">

<h3 style="margin:0">
ゲーム別ポイントログ
</h3>

<div class="export-actions no-print no-export">
<button
class="save-btn"
onclick="exportResultImage()">

画像保存

</button>

</div>

</div>

<div class="log-table-container">

<table
class="log-table"
id="game-log-table">

<thead>

<tr id="log-header-row">

<th class="col-game">
ゲーム
</th>

<th class="col-team">
チーム
</th>

<th>1</th>

<th>2</th>

<th>3</th>

<th>4</th>

<th>5</th>

<th>6</th>

<th>7</th>

<th>8</th>

</tr>

</thead>

<tbody id="game-log-tbody"></tbody>

</table>

</div>

</div>


<!-- =========================
     スタッツ
========================= -->

<div class="card" id="stats-card">

<h3 id="stats-title">
スタッツ集計
</h3>

<div class="stats-wrap">

<table id="stats-table">

<thead>

<tr id="table-header-row">

<th>項目</th>

<th id="th-stat-A">
ペアA
</th>

<th id="th-stat-B">
ペアB
</th>

</tr>

</thead>

<tbody></tbody>

</table>

</div>

</div>

</div>

</div>


<!-- =========================
     サーバー選択
========================= -->

<div id="server-modal" class="modal hidden">

<div class="modal-content">

<h3>
2ゲーム目のサーバー選択
</h3>

<p>
相手ペアの最初のサーバーを選択してください。
</p>

<select id="second-server-select"></select>

<button
style="width:100%;background:var(--primary);color:#fff"
onclick="confirmSecondServer()">

決定

</button>

</div>

</div>


<script>

/* =========================================================
   状態
========================================================= */

let teamNames={
  A:'ペアA',
  B:'ペアB'
};

let players={
  A1:'',
  A2:'',
  B1:'',
  B2:''
};

let rule='6noadd';

let serveOrder=[];
let currentServerIdx=0;

let isSecondServe=false;

let matchDateStr='';
let modeType='simple';

let games={
  A:0,
  B:0
};

let points={
  A:0,
  B:0
};

let selectedPlayer=null;
let selectedPair=null;
let selectedSide='';

let isMatchOver=false;

let stats={};

let gameLogs=[];


/*
  Undo用履歴。

  「操作前」の完全な状態を保存する。
  これが今回の肝。
*/
let history=[];

const pointLabels=[
  '0',
  '15',
  '30',
  '40'
];


/* =========================================================
   初期化
========================================================= */

window.onload=()=>{

  const saved=
    localStorage.getItem('tennis_tool_settings');

  if(saved){

    try{

      const data=JSON.parse(saved);

      if(data.teamA)
        document.getElementById('teamA-name').value=data.teamA;

      if(data.teamB)
        document.getElementById('teamB-name').value=data.teamB;

      if(data.pA1)
        document.getElementById('pA1').value=data.pA1;

      if(data.pA2)
        document.getElementById('pA2').value=data.pA2;

      if(data.pB1)
        document.getElementById('pB1').value=data.pB1;

      if(data.pB2)
        document.getElementById('pB2').value=data.pB2;

    }catch(e){}

  }


  const today=new Date();

  const yyyy=today.getFullYear();

  const mm=String(
    today.getMonth()+1
  ).padStart(2,'0');

  const dd=String(
    today.getDate()
  ).padStart(2,'0');

  document.getElementById(
    'match-date-input'
  ).value=
    `${yyyy}-${mm}-${dd}`;


  const updateSetupOptions=()=>{

    const tA=
      document.getElementById('teamA-name').value ||
      'ペアA';

    const tB=
      document.getElementById('teamB-name').value ||
      'ペアB';

    const pA1=
      document.getElementById('pA1').value;

    const pA2=
      document.getElementById('pA2').value;

    const pB1=
      document.getElementById('pB1').value;

    const pB2=
      document.getElementById('pB2').value;

    const select=
      document.getElementById('first-server');

    select.innerHTML=`

      <option value="A1">
      ${pA1} (${tA})
      </option>

      <option value="A2">
      ${pA2} (${tA})
      </option>

      <option value="B1">
      ${pB1} (${tB})
      </option>

      <option value="B2">
      ${pB2} (${tB})
      </option>

    `;

  };


  [
    'teamA-name',
    'teamB-name',
    'pA1',
    'pA2',
    'pB1',
    'pB2'
  ].forEach(id=>{

    document
      .getElementById(id)
      .addEventListener(
        'input',
        updateSetupOptions
      );

  });


  updateSetupOptions();

};


/* =========================================================
   完全ディープコピー
========================================================= */

function cloneState(obj){

  return JSON.parse(
    JSON.stringify(obj)
  );

}


/* =========================================================
   Undo用スナップショット
========================================================= */

function makeSnapshot(){

  return {

    teamNames:cloneState(teamNames),

    players:cloneState(players),

    rule:rule,

    serveOrder:cloneState(serveOrder),

    currentServerIdx:currentServerIdx,

    isSecondServe:isSecondServe,

    matchDateStr:matchDateStr,

    modeType:modeType,

    games:cloneState(games),

    points:cloneState(points),

    selectedPlayer:selectedPlayer,

    selectedPair:selectedPair,

    selectedSide:selectedSide,

    isMatchOver:isMatchOver,

    stats:cloneState(stats),

    gameLogs:cloneState(gameLogs)

  };

}


/* =========================================================
   スナップショット復元
========================================================= */

function restoreSnapshot(s){

  teamNames=cloneState(s.teamNames);

  players=cloneState(s.players);

  rule=s.rule;

  serveOrder=cloneState(s.serveOrder);

  currentServerIdx=s.currentServerIdx;

  isSecondServe=s.isSecondServe;

  matchDateStr=s.matchDateStr;

  modeType=s.modeType;

  games=cloneState(s.games);

  points=cloneState(s.points);

  selectedPlayer=s.selectedPlayer;

  selectedPair=s.selectedPair;

  selectedSide=s.selectedSide;

  isMatchOver=s.isMatchOver;

  stats=cloneState(s.stats);

  gameLogs=cloneState(s.gameLogs);

}


/* =========================================================
   Undo
========================================================= */

function saveHistory(){

  history.push(
    makeSnapshot()
  );

  /*
    履歴が無限に増えないようにする。
    実用上100手あれば十分。
  */
  if(history.length>100){

    history.shift();

  }

  updateUndoButton();

}


function undoLastAction(){

  if(history.length===0){

    return;

  }

  const previous=
    history.pop();

  restoreSnapshot(previous);

  refreshUI();

  updateUndoButton();

}


function updateUndoButton(){

  const btn=
    document.getElementById('undo-btn');

  if(!btn)return;

  btn.disabled=
    history.length===0;

}


/* =========================================================
   試合開始
========================================================= */

function startGame(){

  teamNames.A=
    document.getElementById('teamA-name').value ||
    'ペアA';

  teamNames.B=
    document.getElementById('teamB-name').value ||
    'ペアB';

  players.A1=
    document.getElementById('pA1').value ||
    '選手A';

  players.A2=
    document.getElementById('pA2').value ||
    '選手a';

  players.B1=
    document.getElementById('pB1').value ||
    '選手B';

  players.B2=
    document.getElementById('pB2').value ||
    '選手b';

  rule=
    document.getElementById('rule-select').value;

  modeType=
    document.querySelector(
      'input[name="mode-type"]:checked'
    ).value;


  localStorage.setItem(
    'tennis_tool_settings',
    JSON.stringify({

      teamA:teamNames.A,
      teamB:teamNames.B,

      pA1:players.A1,
      pA2:players.A2,

      pB1:players.B1,
      pB2:players.B2

    })
  );


  matchDateStr=
    document.getElementById(
      'match-date-input'
    ).value;


  serveOrder=[];

  serveOrder[0]=
    document.getElementById(
      'first-server'
    ).value;


  currentServerIdx=0;

  isSecondServe=false;


  stats={};

  Object.keys(players).forEach(p=>{

    stats[p]={

      serve1In:0,
      serve1Total:0,

      serve2In:0,
      serve2Total:0,

      ace:0,
      df:0,

      strokeW:0,
      strokeE:0,
      foreStrokeW:0,
      foreStrokeE:0,
      backStrokeW:0,
      backStrokeE:0,

      volleyW:0,
      volleyE:0,
      foreVolleyW:0,
      foreVolleyE:0,
      backVolleyW:0,
      backVolleyE:0,

      returnW:0,
      returnE:0

    };

  });


  gameLogs=[
    {
      server:serveOrder[0],
      A:[],
      B:[]
    }
  ];


  games={
    A:0,
    B:0
  };

  points={
    A:0,
    B:0
  };


  selectedPlayer=null;

  selectedPair=null;

  selectedSide='';

  isMatchOver=false;

  history=[];


  document
    .getElementById(
      'display-match-date'
    )
    .innerText=
      matchDateStr;


  if(modeType==='detail'){

    document
      .getElementById('detail-card')
      .classList.remove('hidden');

  }else{

    document
      .getElementById('detail-card')
      .classList.add('hidden');

  }


  document
    .getElementById('setup-screen')
    .classList.add('hidden');

  document
    .getElementById('match-screen')
    .classList.remove('hidden');


  renderSelectorButtons();

  setDefaultServerSelection();

  refreshUI();

}


/* =========================================================
   UI更新
========================================================= */

function refreshUI(){

  updateDisplay();

  renderGameLogTable();

  renderStats();

  updateButtonStates();

  updateUndoButton();

}


/* =========================================================
   選択UI
========================================================= */

function renderSelectorButtons(){

  const container=
    document.getElementById(
      'selector-container'
    );

  container.innerHTML='';


  if(
    modeType==='player' ||
    modeType==='detail'
  ){

    document
      .getElementById(
        'selector-label'
      )
      .innerText=
        '1. ポイントに関与したプレイヤーを選択';


    container.className=
      'btn-grid-4';


    Object.keys(players).forEach(key=>{

      const btn=
        document.createElement('button');

      btn.innerText=
        players[key];

      btn.id=
        `btn-player-${key}`;

      btn.onclick=()=>selectPlayer(key);

      container.appendChild(btn);

    });


  }else{

    document
      .getElementById(
        'selector-label'
      )
      .innerText=
        '1. ポイントに関与したチームを選択';


    container.className=
      'btn-grid-2';


    ['A','B'].forEach(pair=>{

      const btn=
        document.createElement('button');

      btn.innerText=
        `${teamNames[pair]} (${players[pair+'1']} / ${players[pair+'2']})`;

      btn.id=
        `btn-pair-${pair}`;

      btn.onclick=
        ()=>selectPair(pair);

      container.appendChild(btn);

    });

  }

}


function setDefaultServerSelection(){

  const server=
    getCurrentServerKey();


  if(
    modeType==='player' ||
    modeType==='detail'
  ){

    selectPlayer(server);

  }else{

    selectPair(
      server.startsWith('A')
        ? 'A'
        : 'B'
    );

  }

}


function selectPlayer(key){

  selectedPlayer=key;

  Object.keys(players).forEach(k=>{

    const el=
      document.getElementById(
        `btn-player-${k}`
      );

    if(el)
      el.classList.remove('selected');

  });


  const target=
    document.getElementById(
      `btn-player-${key}`
    );

  if(target)
    target.classList.add('selected');


  updateButtonStates();

}


function selectPair(pair){

  selectedPair=pair;

  ['A','B'].forEach(p=>{

    const el=
      document.getElementById(
        `btn-pair-${p}`
      );

    if(el)
      el.classList.remove('selected');

  });


  const target=
    document.getElementById(
      `btn-pair-${pair}`
    );

  if(target)
    target.classList.add('selected');


  updateButtonStates();

}


function updateButtonStates(){

  const ids=[
    'btn-fault',
    'btn-ace',
    'btn-df',
    'btn-strokeW',
    'btn-strokeE',
    'btn-volleyW',
    'btn-volleyE',
    'btn-returnW',
    'btn-returnE'
  ];

  ids.forEach(id=>{

    const el=
      document.getElementById(id);

    if(el)
      el.disabled=false;

  });


  if(isMatchOver){

    ids.forEach(id=>{

      const el=
        document.getElementById(id);

      if(el)
        el.disabled=true;

    });

    return;

  }

  // 詳細モードではストローク/ボレー記録にフォア/バック選択を必須化
  if(modeType==='detail' && !selectedSide){
    ['btn-strokeW','btn-strokeE','btn-volleyW','btn-volleyE'].forEach(id=>{
      const el=document.getElementById(id);
      if(el) el.disabled=true;
    });
  }


  /*
    サーバー判定。

    重要：
    リターン系はサーブ側が選択されていても
    無効にしない。

    実際のダブルスでは、
    「誰がリターンしたか」を選べる必要があるため。
  */

  const server=
    getCurrentServerKey();


  if(
    modeType==='player' ||
    modeType==='detail'
  ){

    const isServerSelected=
      selectedPlayer===server;

    document.getElementById(
      'btn-fault'
    ).disabled=
      !isServerSelected;

    document.getElementById(
      'btn-ace'
    ).disabled=
      !isServerSelected;

    document.getElementById(
      'btn-df'
    ).disabled=
      !isServerSelected;


    /*
      リターンは常に押せる
    */

    const selectedPlayerPair = selectedPlayer
      ? (selectedPlayer.startsWith('A') ? 'A' : 'B')
      : null;

    const serverPair = server.startsWith('A') ? 'A' : 'B';
    const isServerPairSelected = selectedPlayerPair === serverPair;

    document.getElementById(
      'btn-returnW'
    ).disabled=isServerPairSelected;

    document.getElementById(
      'btn-returnE'
    ).disabled=isServerPairSelected;


  }else{

    const serverPair=
      server.startsWith('A')
        ? 'A'
        : 'B';

    const isServerSelected=
      selectedPair===serverPair;


    document.getElementById(
      'btn-fault'
    ).disabled=
      !isServerSelected;

    document.getElementById(
      'btn-ace'
    ).disabled=
      !isServerSelected;

    document.getElementById(
      'btn-df'
    ).disabled=
      !isServerSelected;


    const isServerPairSelected = selectedPair === serverPair;

    document.getElementById(
      'btn-returnW'
    ).disabled=isServerPairSelected;

    document.getElementById(
      'btn-returnE'
    ).disabled=isServerPairSelected;

  }

}


/* =========================================================
   フォア・バック
========================================================= */

function selectSide(side){

  selectedSide=side;

  document
    .getElementById('btn-fore')
    .classList.toggle(
      'selected',
      side==='フォア'
    );

  document
    .getElementById('btn-back')
    .classList.toggle(
      'selected',
      side==='バック'
    );

  updateButtonStates();

}


/* =========================================================
   フォルト
========================================================= */

function handleFault(){

  if(isMatchOver)return;


  /*
    ここで「操作前」の状態を保存。
    これにより、

    1st Fault → Undo

    も完全に戻せる。
  */

  saveHistory();


  const server=
    getCurrentServerKey();


  if(!isSecondServe){

    /*
      1stサーブ失敗
    */

    stats[server].serve1Total++;

    isSecondServe=true;


    /*
      ポイントログにはまだ
      1ポイントを確定させない。

      ただし * を仮ログとして表示する。
    */

    const current=
      gameLogs[
        gameLogs.length-1
      ];


    const marker=
      getDisplayActor(server);

    current.A.push('');
    current.B.push('');

    /*
      1st Fault専用の仮マーカーを
      別管理する代わりに、
      log配列の最後に * を入れる。
    */

    current[
      server.startsWith('A')
        ? 'A'
        : 'B'
    ][
      current[
        server.startsWith('A')
          ? 'A'
          : 'B'
      ].length-1
    ]=
      `*(${marker})`;


    refreshUI();

    return;

  }


  /*
    2ndサーブ失敗
    → DF

    recordPoint()内でも履歴を保存すると
    二重履歴になるので、
    今回は専用処理にする。
  */

  recordDoubleFaultAfterSecondFault();

}


/* =========================================================
   2ndフォルト → DF
========================================================= */

function recordDoubleFaultAfterSecondFault(){

  const server=
    getCurrentServerKey();

  const serverPair=
    server.startsWith('A')
      ? 'A'
      : 'B';


  /*
    直前に1st Faultで
    saveHistory()済み。

    そのためここでは保存しない。
  */


  stats[server].serve2Total++;

  stats[server].df++;


  /*
    1st Faultの仮マーカーを
    DbFへ置き換える（ポイント獲得側の行に記録）
  */

  const current=
    gameLogs[
      gameLogs.length-1
    ];


  const winnerPair = serverPair === 'A' ? 'B' : 'A';
  const index = current.A.length - 1;


  let label = `*DbF(${teamNames[serverPair]})`;

  if(modeType!=='simple' && selectedPlayer){
    label = `*DbF(${players[server]})`;
  }


  // 仮マーカーが置かれていた列の、勝利チーム側にDbFを記録する
  current.A[index] = (winnerPair === 'A') ? label : '';
  current.B[index] = (winnerPair === 'B') ? label : '';


  /*
    ポイント勝者は相手。
  */

  addPoint(winnerPair);


  isSecondServe=false;

  selectedSide='';


  clearSideSelection();


  refreshUI();


  if(!isMatchOver){

    setDefaultServerSelection();

    refreshUI();

  }

}


/* =========================================================
   アクション
========================================================= */

function recordPoint(action){

  if(isMatchOver)return;


  /*
    ここで操作前状態保存。

    これがUndoの本体。
  */

  saveHistory();


  const server=
    getCurrentServerKey();


  /*
    既に1st Faultが存在する場合、
    通常アクションは2nd Serveとして処理。
  */


  /* -------------------------
     サーブ統計
  ------------------------- */

  if(action==='ダブルフォルト'){

    /*
      手動DFボタンを押した場合。

      1st Fault済みなら1st totalは
      既に増えているので増やさない。
    */

    if(!isSecondServe){

      stats[server].serve1Total++;

    }

    stats[server].serve2Total++;

    stats[server].df++;


  }else{

    if(!isSecondServe){

      stats[server].serve1Total++;

      stats[server].serve1In++;

    }else{

      stats[server].serve2Total++;

      stats[server].serve2In++;

    }

  }


  /* -------------------------
     個人スタッツ
  ------------------------- */

  if(
    modeType!=='simple' &&
    selectedPlayer
  ){

    if(action==='サービスエース')
      stats[selectedPlayer].ace++;

    if(action==='ストロークウィナー'){
      stats[selectedPlayer].strokeW++;
      if(modeType==='detail' && selectedSide==='フォア') stats[selectedPlayer].foreStrokeW++;
      if(modeType==='detail' && selectedSide==='バック') stats[selectedPlayer].backStrokeW++;
    }

    if(action==='ストロークエラー'){
      stats[selectedPlayer].strokeE++;
      if(modeType==='detail' && selectedSide==='フォア') stats[selectedPlayer].foreStrokeE++;
      if(modeType==='detail' && selectedSide==='バック') stats[selectedPlayer].backStrokeE++;
    }

    if(action==='ボレーウィナー'){
      stats[selectedPlayer].volleyW++;
      if(modeType==='detail' && selectedSide==='フォア') stats[selectedPlayer].foreVolleyW++;
      if(modeType==='detail' && selectedSide==='バック') stats[selectedPlayer].backVolleyW++;
    }

    if(action==='ボレーエラー'){
      stats[selectedPlayer].volleyE++;
      if(modeType==='detail' && selectedSide==='フォア') stats[selectedPlayer].foreVolleyE++;
      if(modeType==='detail' && selectedSide==='バック') stats[selectedPlayer].backVolleyE++;
    }

    if(action==='リターンエース')
      stats[selectedPlayer].returnW++;

    if(action==='リターンエラー')
      stats[selectedPlayer].returnE++;

  }


  /*
    既に1st Faultを仮ログに入れている場合は、
    その列を再利用する。

    これで

    *  → StW

    のように1ポイント1列になる。
  */

  const current=
    gameLogs[
      gameLogs.length-1
    ];


  const faultAlreadyLogged=
    isSecondServe &&
    current.A.length>0 &&
    (
      current.A[current.A.length-1].startsWith('*') ||
      current.B[current.B.length-1].startsWith('*')
    );


  const winnerPair=
    getWinnerPair(action);


  let abbr=
    getActionAbbr(action);


  /*
    詳細モード
    F/B追加
  */

  if(
    modeType==='detail' &&
    selectedSide
  ){

    abbr+=
      `(${selectedSide==='フォア'
        ? 'F'
        : 'B'})`;

  }


  /*
    誰のプレーか
  */

  if(action==='ダブルフォルト'){
    // ダブルフォルトの場合はサーブ側の名前をラベルに入れる
    if(modeType!=='simple' && selectedPlayer){
      abbr += `(${players[server]})`;
    } else {
      const serverPair = server.startsWith('A') ? 'A' : 'B';
      abbr += `(${teamNames[serverPair]})`;
    }
  } else if(
    modeType!=='simple' &&
    selectedPlayer
  ){

    abbr+=
      `(${players[selectedPlayer]})`;

  }else{

    const actorPair= winnerPair;

    abbr+=
      `(${teamNames[actorPair]})`;

  }


  /*
    ログ格納
  */

  if(faultAlreadyLogged){

    /*
      既存の * を削除して
      2ndサーブ結果へ置換
      (フォルトの場合はポイント取得側＝相手側に置く)
    */

    const index = current.A.length - 1;
    const secondServeAbbr = `*${abbr}`;
    current.A[index] = (winnerPair === 'A') ? secondServeAbbr : '';
    current.B[index] = (winnerPair === 'B') ? secondServeAbbr : '';

  }else{

    current.A.push(
      winnerPair==='A'
        ? abbr
        : ''
    );

    current.B.push(
      winnerPair==='B'
        ? abbr
        : ''
    );

  }


  /*
    ポイント加算
  */

  addPoint(winnerPair);


  /*
    次のポイント
  */

  isSecondServe=false;

  selectedSide='';

  clearSideSelection();


  refreshUI();


  if(!isMatchOver){

    setDefaultServerSelection();

    refreshUI();

  }

}


/* =========================================================
   アクション略称
========================================================= */

function getActionAbbr(action){

  switch(action){

    case 'サービスエース':
      return 'SvA';

    case 'ダブルフォルト':
      return 'DbF';

    case 'ストロークウィナー':
      return 'StW';

    case 'ストロークエラー':
      return 'StE';

    case 'ボレーウィナー':
      return 'VoW';

    case 'ボレーエラー':
      return 'VoE';

    case 'リターンエース':
      return 'RtA';

    case 'リターンエラー':
      return 'RtE';

    default:
      return action;

  }

}


/* =========================================================
   選択者表示
========================================================= */

function getDisplayActor(server){

  if(modeType==='simple'){

    return teamNames[
      server.startsWith('A')
        ? 'A'
        : 'B'
    ];

  }

  return players[server];

}


/* =========================================================
   ポイント勝者
========================================================= */

function getWinnerPair(action){

  /*
    DF
    → サーバー側が失点
  */

  if(action==='ダブルフォルト'){

    return getCurrentServerKey()
      .startsWith('A')
      ? 'B'
      : 'A';

  }


  /*
    エラー
    → エラーした選手/ペアが失点
  */

  if(action.includes('エラー')){

    if(modeType!=='simple'){

      if(!selectedPlayer){

        const sp=
          getCurrentServerKey()
            .startsWith('A')
            ? 'A'
            : 'B';

        return sp==='A'
          ? 'B'
          : 'A';

      }

      const pp=
        selectedPlayer.startsWith('A')
          ? 'A'
          : 'B';

      return pp==='A'
        ? 'B'
        : 'A';

    }


    if(!selectedPair){

      const sp=
        getCurrentServerKey()
          .startsWith('A')
          ? 'A'
          : 'B';

      return sp==='A'
        ? 'B'
        : 'A';

    }

    return selectedPair==='A'
      ? 'B'
      : 'A';

  }


  /*
    ウィナー
  */

  if(modeType!=='simple'){

    if(!selectedPlayer){

      return getCurrentServerKey()
        .startsWith('A')
        ? 'A'
        : 'B';

    }

    return selectedPlayer.startsWith('A')
      ? 'A'
      : 'B';

  }


  return selectedPair ||
    (
      getCurrentServerKey()
        .startsWith('A')
        ? 'A'
        : 'B'
    );

}


/* =========================================================
   ポイント → ゲーム
========================================================= */

function addPoint(pair){

  points[pair]++;

  const other=
    pair==='A'
      ? 'B'
      : 'A';

  let gameWon=false;


  if(rule==='6noadd'){

    if(
      points[pair]>=4 &&
      points[pair]!==points[other]
    ){

      gameWon=true;

    }

  }


  else if(rule==='6semiadd'){

    if(
      points[pair]>=4 &&
      points[pair]-points[other]>=1
    ){

      gameWon=true;

    }

  }


  else if(rule==='1set'){

    if(
      points[pair]>=4 &&
      points[pair]-points[other]>=2
    ){

      gameWon=true;

    }

  }


  if(gameWon){

    games[pair]++;

    points.A=0;
    points.B=0;

    onGameEnd();

  }

}


/* =========================================================
   ゲーム終了
========================================================= */

function onGameEnd(){

  /*
    ノーアド
  */

  if(
    rule==='6noadd' &&
    (games.A===6 || games.B===6) &&
    games.A!==games.B
  ){

    endMatch(
      games.A>games.B
        ? `${teamNames.A}の勝利！`
        : `${teamNames.B}の勝利！`
    );

    return;

  }


  /*
    通常6ゲーム先取
  */

  if(
    rule!=='6noadd' &&
    (
      (
        games.A>=6 &&
        games.A-games.B>=2
      )
      ||
      (
        games.B>=6 &&
        games.B-games.A>=2
      )
    )
  ){

    endMatch(
      games.A>games.B
        ? `${teamNames.A}の勝利！`
        : `${teamNames.B}の勝利！`
    );

    return;

  }


  /*
    次ゲームログ
  */

  gameLogs.push({
    server:null,
    A:[],
    B:[]
  });


  const totalGames=
    games.A+games.B;


  /*
    2ゲーム目
  */

  if(
    totalGames===1 &&
    serveOrder.length<2
  ){

    showSecondServerModal();

  }else{

    currentServerIdx=
      (currentServerIdx+1)%4;

    gameLogs[gameLogs.length-1].server=getCurrentServerKey();

    setDefaultServerSelection();

  }

}


/* =========================================================
   試合終了
========================================================= */

function endMatch(message){

  isMatchOver=true;

  document
    .getElementById('serve-info')
    .innerText=
      `試合終了: ${message}`;

  document
    .getElementById('serve-info')
    .style.color=
      '#38bdf8';

}


/* =========================================================
   2ゲーム目サーバー
========================================================= */

function showSecondServerModal(){

  const first=
    serveOrder[0];

  const isA=
    first.startsWith('A');

  const targetPair=
    isA
      ? ['B1','B2']
      : ['A1','A2'];


  const select=
    document.getElementById(
      'second-server-select'
    );


  select.innerHTML=`

    <option value="${targetPair[0]}">
      ${players[targetPair[0]]}
    </option>

    <option value="${targetPair[1]}">
      ${players[targetPair[1]]}
    </option>

  `;


  document
    .getElementById('server-modal')
    .classList.remove('hidden');

}


function confirmSecondServer(){

  /*
    モーダル決定前の状態を保存。

    Undoすれば2ゲーム目サーバー選択前に戻る。
  */

  saveHistory();


  const secondServer=
    document.getElementById(
      'second-server-select'
    ).value;


  serveOrder[1]=secondServer;


  const first=serveOrder[0];

  const second=serveOrder[1];


  serveOrder[2]=
    first.endsWith('1')
      ? first.slice(0,1)+'2'
      : first.slice(0,1)+'1';


  serveOrder[3]=
    second.endsWith('1')
      ? second.slice(0,1)+'2'
      : second.slice(0,1)+'1';


  document
    .getElementById('server-modal')
    .classList.add('hidden');


  currentServerIdx=1;

  gameLogs[gameLogs.length-1].server=secondServer;

  setDefaultServerSelection();

  refreshUI();

}


/* =========================================================
   現在サーバー
========================================================= */

function getCurrentServerKey(){

  return serveOrder[currentServerIdx] ||
         serveOrder[0];

}


/* =========================================================
   表示
========================================================= */

function updateDisplay(){

  document
    .getElementById('game-score')
    .innerText=
      `ゲームスコア: ${teamNames.A} ${games.A} - ${games.B} ${teamNames.B}`;


  document
    .getElementById('point-score')
    .innerText=
      `${pointLabels[points.A] || points.A} - ${pointLabels[points.B] || points.B}`;


  if(!isMatchOver){

    const server=
      getCurrentServerKey();

    const serverName=
      players[server] || '未定';


    const serveState=
      isSecondServe
        ? '2nd Serve'
        : '1st Serve';


    document
      .getElementById('serve-info')
      .innerText=
        `サーバー: ${serverName} (${serveState})`;

  }

}


/* =========================================================
   ログ
========================================================= */

function renderGameLogTable(){

  const headerRow=
    document.getElementById(
      'log-header-row'
    );

  const tbody=
    document.getElementById(
      'game-log-tbody'
    );


  let maxCols=8;


  gameLogs.forEach(g=>{

    maxCols=
      Math.max(
        maxCols,
        g.A.length,
        g.B.length
      );

  });


  let headerHtml=`

    <th class="col-game">
      ゲーム
    </th>

    <th class="col-team">
      チーム
    </th>

  `;


  for(
    let i=1;
    i<=maxCols;
    i++
  ){

    headerHtml+=
      `<th>${i}</th>`;

  }


  headerRow.innerHTML=
    headerHtml;


  let html='';


  gameLogs.forEach((g,index)=>{

    const gameNum=index+1;


    html+=`

      <tr>

        <td
          rowspan="2"
          class="col-game"
          style="vertical-align:middle">

          ${gameNum}<br>
          <span style="font-size:.72rem;font-weight:normal;white-space:normal;line-height:1.2">
            S: ${players[g.server] || '未定'}
          </span>

        </td>

        <td class="col-team">
          ${teamNames.A}
        </td>

    `;


    for(
      let i=0;
      i<maxCols;
      i++
    ){

      html+=`
        <td>
          ${g.A[i] || ''}
        </td>
      `;

    }


    html+='</tr>';


    html+=`

      <tr>

        <td class="col-team">
          ${teamNames.B}
        </td>

    `;


    for(
      let i=0;
      i<maxCols;
      i++
    ){

      html+=`
        <td>
          ${g.B[i] || ''}
        </td>
      `;

    }


    html+='</tr>';

  });


  tbody.innerHTML=html;

}


/* =========================================================
   スタッツ
========================================================= */

function getPairStat(pair,key){

  return (
    stats[pair+'1'][key] +
    stats[pair+'2'][key]
  );

}


function getServePct(inCount,total){

  return total===0
    ? '0%'
    : Math.round(
        inCount/total*100
      )+'%';

}


/* =========================================================

function getErrorRate(errorCount,winnerCount){
  const total=errorCount+winnerCount;
  return total===0 ? '0%' : Math.round(errorCount/total*100)+'%';
}

function getPairErrorRate(pair,errorKey,winnerKey){
  return getErrorRate(
    getPairStat(pair,errorKey),
    getPairStat(pair,winnerKey)
  );
}

/* =========================================================
   スマホ向け画像出力
   DOM→SVG変換はiOS Safariで失敗しやすいため、Canvasへ直接描画する。
========================================================= */

async function exportResultImage(){

  try{
    const canvas=buildResultCanvas();
    const blob=await canvasToPngBlob(canvas);

    const safeDate=matchDateStr || new Date().toISOString().slice(0,10);
    const filename=`tennis_stats_${safeDate}.png`;
    const file=new File([blob],filename,{type:'image/png'});

    // 対応スマホでは共有シートを優先（「画像を保存」が使える）。
    if(navigator.share && navigator.canShare && navigator.canShare({files:[file]})){
      try{
        await navigator.share({files:[file],title:'テニススタッツ'});
        return;
      }catch(err){
        if(err && err.name==='AbortError')return;
        console.warn('share failed; fallback to preview',err);
      }
    }

    // 共有APIが使えない場合も必ず画像プレビューを出す。
    // スマホは長押し保存、PCはダウンロード可能。
    showImagePreview(blob,filename);

  }catch(err){
    console.error(err);
    alert(`画像生成に失敗しました: ${err && err.message ? err.message : err}`);
  }
}

function canvasToPngBlob(canvas){
  return new Promise((resolve,reject)=>{
    canvas.toBlob(blob=>{
      if(blob)resolve(blob);
      else reject(new Error('PNG Blobを生成できませんでした'));
    },'image/png');
  });
}

function getTableMatrix(table){
  return [...table.rows].map(row=>
    [...row.cells].map(cell=>({
      text:(cell.innerText || '').replace(/\s+/g,' ').trim(),
      colspan:cell.colSpan || 1,
      rowspan:cell.rowSpan || 1
    }))
  );
}

function buildGameLogMatrixForExport(){
  let maxCols=8;
  gameLogs.forEach(g=>{
    maxCols=Math.max(maxCols,g.A.length,g.B.length);
  });

  const matrix=[];
  matrix.push([
    {text:'ゲーム',colspan:1,rowspan:1},
    {text:'チーム',colspan:1,rowspan:1},
    ...Array.from({length:maxCols},(_,i)=>({text:String(i+1),colspan:1,rowspan:1}))
  ]);

  gameLogs.forEach((g,index)=>{
    const serverName=players[g.server] || '未定';
    matrix.push([
      {text:`${index+1} / S:${serverName}`,colspan:1,rowspan:1},
      {text:teamNames.A,colspan:1,rowspan:1},
      ...Array.from({length:maxCols},(_,i)=>({text:g.A[i] || '',colspan:1,rowspan:1}))
    ]);
    matrix.push([
      {text:'',colspan:1,rowspan:1},
      {text:teamNames.B,colspan:1,rowspan:1},
      ...Array.from({length:maxCols},(_,i)=>({text:g.B[i] || '',colspan:1,rowspan:1}))
    ]);
  });

  return matrix;
}

function buildResultCanvas(){
  const statsTable=document.getElementById('stats-table');
  if(!statsTable)throw new Error('出力対象の表が見つかりません');

  const log=buildGameLogMatrixForExport();
  const statsMatrix=getTableMatrix(statsTable);

  const fontFamily='-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif';
  const baseFont=18;
  const smallFont=16;
  const rowH=46;
  const pad=28;

  const measureCanvas=document.createElement('canvas');
  const mctx=measureCanvas.getContext('2d');
  mctx.font=`${baseFont}px ${fontFamily}`;

  const calcWidths=(matrix,kind)=>{
    let cols=0;
    matrix.forEach(r=>{ cols=Math.max(cols,r.reduce((n,c)=>n+c.colspan,0)); });
    const widths=Array(cols).fill(kind==='log'?105:140);

    matrix.forEach(r=>{
      let ci=0;
      r.forEach(c=>{
        if(c.colspan===1){
          const measured=Math.ceil(mctx.measureText(c.text).width)+24;
          widths[ci]=Math.max(widths[ci],Math.min(measured,kind==='log'?(ci<2?180:155):220));
        }
        ci+=c.colspan;
      });
    });

    if(kind==='log'){
      if(widths[0])widths[0]=Math.max(widths[0],120);
      if(widths[1])widths[1]=Math.max(widths[1],140);
    }
    return widths;
  };

  const logWidths=calcWidths(log,'log');
  const statWidths=calcWidths(statsMatrix,'stats');
  const logW=logWidths.reduce((a,b)=>a+b,0);
  const statW=statWidths.reduce((a,b)=>a+b,0);
  const contentW=Math.max(logW,statW,900);

  const scoreH=190;
  const titleH=58;
  const logH=log.length*rowH;
  const statsH=statsMatrix.length*rowH;
  const gap=30;
  const contentH=pad+scoreH+gap+titleH+logH+gap+titleH+statsH+pad;

  // 高解像度化しつつ、巨大Canvasによるスマホのメモリ不足を避ける。
  const scale=Math.min(window.devicePixelRatio || 1,1.6);
  const canvas=document.createElement('canvas');
  canvas.width=Math.ceil((contentW+pad*2)*scale);
  canvas.height=Math.ceil(contentH*scale);
  const ctx=canvas.getContext('2d');
  if(!ctx)throw new Error('Canvasを初期化できません');
  ctx.scale(scale,scale);

  const W=contentW+pad*2;
  ctx.fillStyle='#f8fafc';
  ctx.fillRect(0,0,W,contentH);

  const drawText=(text,x,y,size=baseFont,bold=false,align='left',color='#1e293b')=>{
    ctx.font=`${bold?'700':'400'} ${size}px ${fontFamily}`;
    ctx.textAlign=align;
    ctx.textBaseline='middle';
    ctx.fillStyle=color;
    ctx.fillText(text,x,y);
  };

  // スコアボード
  let y=pad;
  ctx.fillStyle='#0f172a';
  roundRect(ctx,pad,y,contentW,scoreH,12);
  ctx.fill();
  drawText(matchDateStr || '',W/2,y+32,18,false,'center','#38bdf8');
  drawText(document.getElementById('game-score').innerText,W/2,y+72,24,true,'center','#cbd5e1');
  drawText(document.getElementById('point-score').innerText,W/2,y+116,42,true,'center','#38bdf8');
  drawText(document.getElementById('serve-info').innerText,W/2,y+158,20,false,'center','#fde047');
  y+=scoreH+gap;

  drawText('ゲーム別ポイントログ',pad,y+titleH/2,24,true,'left');
  y+=titleH;
  drawCanvasTable(ctx,log,pad,y,logWidths,rowH,fontFamily,smallFont);
  y+=logH+gap;

  drawText(document.getElementById('stats-title').innerText,pad,y+titleH/2,24,true,'left');
  y+=titleH;
  drawCanvasTable(ctx,statsMatrix,pad,y,statWidths,rowH,fontFamily,smallFont);

  return canvas;
}

function roundRect(ctx,x,y,w,h,r){
  const rr=Math.min(r,w/2,h/2);
  ctx.beginPath();
  ctx.moveTo(x+rr,y);
  ctx.arcTo(x+w,y,x+w,y+h,rr);
  ctx.arcTo(x+w,y+h,x,y+h,rr);
  ctx.arcTo(x,y+h,x,y,rr);
  ctx.arcTo(x,y,x+w,y,rr);
  ctx.closePath();
}

function drawCanvasTable(ctx,matrix,x,y,widths,rowH,fontFamily,fontSize){
  const totalW=widths.reduce((a,b)=>a+b,0);
  let cy=y;

  matrix.forEach((row,ri)=>{
    let cx=x;
    let colIndex=0;

    row.forEach(cell=>{
      const cellW=widths.slice(colIndex,colIndex+cell.colspan).reduce((a,b)=>a+b,0);
      const cellH=rowH*cell.rowspan;

      ctx.fillStyle=ri===0 ? '#e2e8f0' : '#ffffff';
      ctx.fillRect(cx,cy,cellW,cellH);
      ctx.strokeStyle='#cbd5e1';
      ctx.lineWidth=1;
      ctx.strokeRect(cx+.5,cy+.5,cellW-1,cellH-1);

      ctx.save();
      ctx.beginPath();
      ctx.rect(cx+5,cy+3,cellW-10,cellH-6);
      ctx.clip();
      ctx.font=`${ri===0?'700':'400'} ${fontSize}px ${fontFamily}`;
      ctx.textAlign='center';
      ctx.textBaseline='middle';
      ctx.fillStyle='#1e293b';
      ctx.fillText(cell.text,cx+cellW/2,cy+cellH/2);
      ctx.restore();

      cx+=cellW;
      colIndex+=cell.colspan;
    });

    cy+=rowH;
  });

  return totalW;
}

function showImagePreview(blob,filename){
  const old=document.getElementById('image-preview-modal');
  if(old)old.remove();

  const url=URL.createObjectURL(blob);
  const modal=document.createElement('div');
  modal.id='image-preview-modal';
  modal.className='modal';
  modal.innerHTML=`
    <div class="modal-content" style="max-width:720px;max-height:92vh;overflow:auto">
      <h3>画像を保存</h3>
      <p style="font-size:.85rem;color:#64748b;margin-top:0">スマホは画像を長押しして保存できます。</p>
      <img src="${url}" alt="テニススタッツ画像" style="width:100%;height:auto;border:1px solid #e2e8f0;border-radius:6px;display:block">
      <div style="display:flex;gap:8px;margin-top:12px">
        <a href="${url}" download="${filename}" style="flex:1;text-align:center;padding:12px;border-radius:6px;background:#2563eb;color:#fff;text-decoration:none;font-weight:bold">ダウンロード</a>
        <button type="button" id="close-image-preview" style="flex:1">閉じる</button>
      </div>
    </div>`;
  document.body.appendChild(modal);

  document.getElementById('close-image-preview').onclick=()=>{
    URL.revokeObjectURL(url);
    modal.remove();
  };
}

/* =========================================================
   モバイル向けタップフィードバック
   - touch-action: manipulation と組み合わせてダブルタップ拡大を抑制
   - pointerdown直後に押下状態を表示して体感レスポンスを向上
========================================================= */
(function setupFastButtonFeedback(){
  const clearPress = (btn) => {
    if(btn) btn.classList.remove('is-pressing');
  };

  document.addEventListener('pointerdown', (e) => {
    const btn = e.target.closest('button:not(:disabled)');
    if(!btn) return;
    btn.classList.add('is-pressing');
  }, {passive:true});

  ['pointerup','pointercancel','pointerleave'].forEach(type => {
    document.addEventListener(type, (e) => {
      const btn = e.target.closest && e.target.closest('button');
      clearPress(btn);
    }, {passive:true});
  });

  window.addEventListener('blur', () => {
    document.querySelectorAll('button.is-pressing').forEach(clearPress);
  });
})();

</script>
