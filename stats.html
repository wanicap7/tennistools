<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>テニススタッツ計測ツール</title>

<style>
:root{
  --primary:#2563eb;
  --bg:#f8fafc;
  --card:#ffffff;
  --text:#1e293b;
  --border:#e2e8f0;
}

*{
  box-sizing:border-box;
}

body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:var(--bg);
  color:var(--text);
  margin:0;
  padding:12px;
}

.container{
  max-width:850px;
  margin:0 auto;
}

.card{
  background:var(--card);
  border-radius:8px;
  padding:16px;
  margin-bottom:12px;
  border:1px solid var(--border);
  box-shadow:0 1px 3px rgba(0,0,0,.05);
}

h2,h3{
  margin-top:0;
  margin-bottom:12px;
  text-align:center;
}

button{
  padding:12px 8px;
  font-size:.95rem;
  font-weight:bold;
  border-radius:6px;
  border:1px solid #cbd5e1;
  background:#f1f5f9;
  color:var(--text);
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}

button:active{
  transform:scale(.98);
}

button.selected{
  background:var(--primary)!important;
  color:#fff!important;
  border-color:var(--primary)!important;
}

button.action-btn{
  background:#fff;
  border:2px solid #cbd5e1;
}

button.fault-btn{
  background:#fef3c7;
  border-color:#f59e0b;
  color:#b45309;
  grid-column:span 2;
}

button:disabled{
  opacity:.4;
  cursor:not-allowed;
  transform:none!important;
}

.btn-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
  margin-bottom:8px;
}

.btn-grid-4{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:6px;
}

.btn-grid-2{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
}

input[type=text],
input[type=date],
select{
  width:100%;
  padding:9px;
  margin-bottom:8px;
  border:1px solid var(--border);
  border-radius:4px;
}

.scoreboard{
  background:#0f172a;
  color:#fff;
  padding:12px;
  border-radius:8px;
  text-align:center;
}

.match-date{
  font-size:.85rem;
  color:#38bdf8;
  margin-bottom:4px;
}

.score-sets{
  font-size:1.05rem;
  color:#94a3b8;
  margin-bottom:4px;
}

.score-main{
  font-size:2rem;
  font-weight:bold;
  letter-spacing:2px;
  color:#38bdf8;
}

.serve-status{
  font-size:.9rem;
  margin-top:4px;
  color:#fde047;
}

.toggle-container{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin:6px 0;
  font-size:.9rem;
}

.hidden{
  display:none!important;
}

.log-table-container{
  overflow-x:auto;
  margin-bottom:8px;
  -webkit-overflow-scrolling:touch;
}

table{
  width:100%;
  border-collapse:collapse;
  font-size:.8rem;
  text-align:center;
}

th,td{
  border:1px solid var(--border);
  padding:6px 4px;
  background:#fff;
}

th{
  background:#f1f5f9;
}

.log-table{
  min-width:600px;
}

.log-table th,
.log-table td{
  white-space:nowrap;
  min-width:55px;
}

.log-table th.col-game,
.log-table td.col-game{
  position:sticky;
  left:0;
  background:#f1f5f9;
  z-index:10;
  width:45px;
  min-width:45px;
  font-weight:bold;
}

.log-table th.col-team,
.log-table td.col-team{
  position:sticky;
  left:45px;
  background:#f1f5f9;
  z-index:10;
  width:90px;
  min-width:90px;
  font-weight:bold;
}

.log-table tbody tr td.col-game,
.log-table tbody tr td.col-team{
  background:#f8fafc;
}

.stats-wrap{
  overflow-x:auto;
  -webkit-overflow-scrolling:touch;
}

#stats-table{
  min-width:600px;
}

.modal{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,.6);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:100;
}

.modal-content{
  background:#fff;
  padding:20px;
  border-radius:8px;
  max-width:400px;
  width:90%;
}

.top-actions{
  display:flex;
  gap:6px;
}

.undo-btn{
  background:#fff;
  border:2px solid #94a3b8;
}

.save-btn{
  background:var(--primary);
  color:#fff;
  border-color:var(--primary);
}

@media(max-width:600px){

  body{
    padding:8px;
  }

  .card{
    padding:12px;
  }

  .btn-grid-4{
    grid-template-columns:repeat(2,1fr);
  }

  button{
    min-height:48px;
  }

  .score-main{
    font-size:1.8rem;
  }
}

@media print{

  body{
    background:#fff;
    padding:0;
  }

  .no-print{
    display:none!important;
  }

  .card{
    border:none;
    box-shadow:none;
    padding:4px;
    margin-bottom:8px;
  }

  .scoreboard{
    background:#000!important;
    color:#fff!important;
    -webkit-print-color-adjust:exact;
    print-color-adjust:exact;
  }
}
</style>
</head>

<body>

<div class="container">

<!-- =========================
     初期設定
========================= -->

<div id="setup-screen" class="card">

<h2>試合初期設定</h2>

<label>試合日</label>
<input type="date" id="match-date-input">

<div style="display:flex;gap:8px">

<div style="flex:1">
<label>ペアA チーム名</label>
<input type="text" id="teamA-name" value="ペアA">
</div>

<div style="flex:1">
<label>ペアB チーム名</label>
<input type="text" id="teamB-name" value="ペアB">
</div>

</div>

<label>ペアA 選手</label>

<div style="display:flex;gap:8px">

<input type="text" id="pA1" value="選手A">
<input type="text" id="pA2" value="選手a">

</div>

<label>ペアB 選手</label>

<div style="display:flex;gap:8px">

<input type="text" id="pB1" value="選手B">
<input type="text" id="pB2" value="選手b">

</div>

<label>ルール</label>

<select id="rule-select">

<option value="6noadd">
6ゲーム先取 (ノーアド)
</option>

<option value="6semiadd">
6ゲーム先取 (セミアド)
</option>

<option value="1set">
1セットマッチ (6-6タイブレーク)
</option>

</select>

<label>第1ゲーム サーバー</label>

<select id="first-server"></select>

<div class="card"
style="margin-top:12px;background:#f8fafc">

<label style="font-weight:bold">
計測モード
</label>

<div style="display:flex;flex-direction:column;gap:6px">

<label>
<input type="radio"
name="mode-type"
value="simple"
checked>
シンプルモード（ペア単位）
</label>

<label>
<input type="radio"
name="mode-type"
value="player">
選手別モード
</label>

<label>
<input type="radio"
name="mode-type"
value="detail">
詳細モード（選手＋フォア/バック）
</label>

</div>
</div>

<button
style="width:100%;background:var(--primary);color:#fff"
onclick="startGame()">

試合開始

</button>

</div>


<!-- =========================
     試合画面
========================= -->

<div id="match-screen" class="hidden">

<div class="card scoreboard">

<div class="match-date"
id="display-match-date">
</div>

<div class="score-sets"
id="game-score">
ゲームスコア: 0 - 0
</div>

<div class="score-main"
id="point-score">
0 - 0
</div>

<div class="serve-status"
id="serve-info">
サーバー: -
</div>

</div>


<!-- 操作 -->

<div class="no-print">

<div class="card">

<div class="top-actions">

<button
class="undo-btn"
id="undo-btn"
onclick="undoLastAction()"
style="flex:1">

↩ 1つ戻る

</button>

</div>

</div>


<!-- 打点 -->

<div id="detail-card"
class="card hidden">

<div style="font-weight:bold;margin-bottom:8px">
打点選択
</div>

<div class="btn-grid">

<button
id="btn-fore"
onclick="selectSide('フォア')">
フォア
</button>

<button
id="btn-back"
onclick="selectSide('バック')">
バック
</button>

</div>

</div>


<!-- プレイヤー選択 -->

<div class="card">

<div
style="font-size:.8rem;color:#64748b;margin-bottom:4px"
id="selector-label">

1. ポイントに関与した選択

</div>

<div id="selector-container"></div>

</div>


<!-- アクション -->

<div class="card">

<div
style="font-size:.8rem;color:#64748b;margin-bottom:4px">

2. アクション

</div>

<div class="btn-grid">

<button
class="fault-btn"
id="btn-fault"
onclick="handleFault()">

フォルト

</button>

<button
class="action-btn"
id="btn-ace"
onclick="recordPoint('サービスエース')">

サービスエース

</button>

<button
class="action-btn"
id="btn-df"
onclick="recordPoint('ダブルフォルト')">

ダブルフォルト

</button>

<button
class="action-btn"
id="btn-strokeW"
onclick="recordPoint('ストロークウィナー')">

ストロークウィナー

</button>

<button
class="action-btn"
id="btn-strokeE"
onclick="recordPoint('ストロークエラー')">

ストロークエラー

</button>

<button
class="action-btn"
id="btn-volleyW"
onclick="recordPoint('ボレーウィナー')">

ボレーウィナー

</button>

<button
class="action-btn"
id="btn-volleyE"
onclick="recordPoint('ボレーエラー')">

ボレーエラー

</button>

<button
class="action-btn"
id="btn-returnW"
onclick="recordPoint('リターンエース')">

リターンエース

</button>

<button
class="action-btn"
id="btn-returnE"
onclick="recordPoint('リターンエラー')">

リターンエラー

</button>

</div>

</div>

</div>


<!-- =========================
     ログ
========================= -->

<div class="card">

<div style="
display:flex;
justify-content:space-between;
align-items:center;
gap:8px;
margin-bottom:8px;
">

<h3 style="margin:0">
ゲーム別ポイントログ
</h3>

<button
class="save-btn no-print"
onclick="window.print()">

画像/PDF保存

</button>

</div>

<div class="log-table-container">

<table
class="log-table"
id="game-log-table">

<thead>

<tr id="log-header-row">

<th class="col-game">
ゲーム
</th>

<th class="col-team">
チーム
</th>

<th>1</th>

<th>2</th>

<th>3</th>

<th>4</th>

<th>5</th>

<th>6</th>

<th>7</th>

<th>8</th>

</tr>

</thead>

<tbody id="game-log-tbody"></tbody>

</table>

</div>

</div>


<!-- =========================
     スタッツ
========================= -->

<div class="card">

<h3 id="stats-title">
スタッツ集計
</h3>

<div class="stats-wrap">

<table id="stats-table">

<thead>

<tr id="table-header-row">

<th>項目</th>

<th id="th-stat-A">
ペアA
</th>

<th id="th-stat-B">
ペアB
</th>

</tr>

</thead>

<tbody></tbody>

</table>

</div>

</div>

</div>

</div>


<!-- =========================
     サーバー選択
========================= -->

<div id="server-modal" class="modal hidden">

<div class="modal-content">

<h3>
2ゲーム目のサーバー選択
</h3>

<p>
相手ペアの最初のサーバーを選択してください。
</p>

<select id="second-server-select"></select>

<button
style="width:100%;background:var(--primary);color:#fff"
onclick="confirmSecondServer()">

決定

</button>

</div>

</div>


<script>

/* =========================================================
   状態
========================================================= */

let teamNames={
  A:'ペアA',
  B:'ペアB'
};

let players={
  A1:'',
  A2:'',
  B1:'',
  B2:''
};

let rule='6noadd';

let serveOrder=[];
let currentServerIdx=0;

let isSecondServe=false;

let matchDateStr='';
let modeType='simple';

let games={
  A:0,
  B:0
};

let points={
  A:0,
  B:0
};

let selectedPlayer=null;
let selectedPair=null;
let selectedSide='';

let isMatchOver=false;

let stats={};

let gameLogs=[];


/*
  Undo用履歴。

  「操作前」の完全な状態を保存する。
  これが今回の肝。
*/
let history=[];

const pointLabels=[
  '0',
  '15',
  '30',
  '40'
];


/* =========================================================
   初期化
========================================================= */

window.onload=()=>{

  const saved=
    localStorage.getItem('tennis_tool_settings');

  if(saved){

    try{

      const data=JSON.parse(saved);

      if(data.teamA)
        document.getElementById('teamA-name').value=data.teamA;

      if(data.teamB)
        document.getElementById('teamB-name').value=data.teamB;

      if(data.pA1)
        document.getElementById('pA1').value=data.pA1;

      if(data.pA2)
        document.getElementById('pA2').value=data.pA2;

      if(data.pB1)
        document.getElementById('pB1').value=data.pB1;

      if(data.pB2)
        document.getElementById('pB2').value=data.pB2;

    }catch(e){}

  }


  const today=new Date();

  const yyyy=today.getFullYear();

  const mm=String(
    today.getMonth()+1
  ).padStart(2,'0');

  const dd=String(
    today.getDate()
  ).padStart(2,'0');

  document.getElementById(
    'match-date-input'
  ).value=
    `${yyyy}-${mm}-${dd}`;


  const updateSetupOptions=()=>{

    const tA=
      document.getElementById('teamA-name').value ||
      'ペアA';

    const tB=
      document.getElementById('teamB-name').value ||
      'ペアB';

    const pA1=
      document.getElementById('pA1').value;

    const pA2=
      document.getElementById('pA2').value;

    const pB1=
      document.getElementById('pB1').value;

    const pB2=
      document.getElementById('pB2').value;

    const select=
      document.getElementById('first-server');

    select.innerHTML=`

      <option value="A1">
      ${pA1} (${tA})
      </option>

      <option value="A2">
      ${pA2} (${tA})
      </option>

      <option value="B1">
      ${pB1} (${tB})
      </option>

      <option value="B2">
      ${pB2} (${tB})
      </option>

    `;

  };


  [
    'teamA-name',
    'teamB-name',
    'pA1',
    'pA2',
    'pB1',
    'pB2'
  ].forEach(id=>{

    document
      .getElementById(id)
      .addEventListener(
        'input',
        updateSetupOptions
      );

  });


  updateSetupOptions();

};


/* =========================================================
   完全ディープコピー
========================================================= */

function cloneState(obj){

  return JSON.parse(
    JSON.stringify(obj)
  );

}


/* =========================================================
   Undo用スナップショット
========================================================= */

function makeSnapshot(){

  return {

    teamNames:cloneState(teamNames),

    players:cloneState(players),

    rule:rule,

    serveOrder:cloneState(serveOrder),

    currentServerIdx:currentServerIdx,

    isSecondServe:isSecondServe,

    matchDateStr:matchDateStr,

    modeType:modeType,

    games:cloneState(games),

    points:cloneState(points),

    selectedPlayer:selectedPlayer,

    selectedPair:selectedPair,

    selectedSide:selectedSide,

    isMatchOver:isMatchOver,

    stats:cloneState(stats),

    gameLogs:cloneState(gameLogs)

  };

}


/* =========================================================
   スナップショット復元
========================================================= */

function restoreSnapshot(s){

  teamNames=cloneState(s.teamNames);

  players=cloneState(s.players);

  rule=s.rule;

  serveOrder=cloneState(s.serveOrder);

  currentServerIdx=s.currentServerIdx;

  isSecondServe=s.isSecondServe;

  matchDateStr=s.matchDateStr;

  modeType=s.modeType;

  games=cloneState(s.games);

  points=cloneState(s.points);

  selectedPlayer=s.selectedPlayer;

  selectedPair=s.selectedPair;

  selectedSide=s.selectedSide;

  isMatchOver=s.isMatchOver;

  stats=cloneState(s.stats);

  gameLogs=cloneState(s.gameLogs);

}


/* =========================================================
   Undo
========================================================= */

function saveHistory(){

  history.push(
    makeSnapshot()
  );

  /*
    履歴が無限に増えないようにする。
    実用上100手あれば十分。
  */
  if(history.length>100){

    history.shift();

  }

  updateUndoButton();

}


function undoLastAction(){

  if(history.length===0){

    return;

  }

  const previous=
    history.pop();

  restoreSnapshot(previous);

  refreshUI();

  updateUndoButton();

}


function updateUndoButton(){

  const btn=
    document.getElementById('undo-btn');

  if(!btn)return;

  btn.disabled=
    history.length===0;

}


/* =========================================================
   試合開始
========================================================= */

function startGame(){

  teamNames.A=
    document.getElementById('teamA-name').value ||
    'ペアA';

  teamNames.B=
    document.getElementById('teamB-name').value ||
    'ペアB';

  players.A1=
    document.getElementById('pA1').value ||
    '選手A';

  players.A2=
    document.getElementById('pA2').value ||
    '選手a';

  players.B1=
    document.getElementById('pB1').value ||
    '選手B';

  players.B2=
    document.getElementById('pB2').value ||
    '選手b';

  rule=
    document.getElementById('rule-select').value;

  modeType=
    document.querySelector(
      'input[name="mode-type"]:checked'
    ).value;


  localStorage.setItem(
    'tennis_tool_settings',
    JSON.stringify({

      teamA:teamNames.A,
      teamB:teamNames.B,

      pA1:players.A1,
      pA2:players.A2,

      pB1:players.B1,
      pB2:players.B2

    })
  );


  matchDateStr=
    document.getElementById(
      'match-date-input'
    ).value;


  serveOrder=[];

  serveOrder[0]=
    document.getElementById(
      'first-server'
    ).value;


  currentServerIdx=0;

  isSecondServe=false;


  stats={};

  Object.keys(players).forEach(p=>{

    stats[p]={

      serve1In:0,
      serve1Total:0,

      serve2In:0,
      serve2Total:0,

      ace:0,
      df:0,

      strokeW:0,
      strokeE:0,

      volleyW:0,
      volleyE:0,

      returnW:0,
      returnE:0

    };

  });


  gameLogs=[
    {
      A:[],
      B:[]
    }
  ];


  games={
    A:0,
    B:0
  };

  points={
    A:0,
    B:0
  };


  selectedPlayer=null;

  selectedPair=null;

  selectedSide='';

  isMatchOver=false;

  history=[];


  document
    .getElementById(
      'display-match-date'
    )
    .innerText=
      matchDateStr;


  if(modeType==='detail'){

    document
      .getElementById('detail-card')
      .classList.remove('hidden');

  }else{

    document
      .getElementById('detail-card')
      .classList.add('hidden');

  }


  document
    .getElementById('setup-screen')
    .classList.add('hidden');

  document
    .getElementById('match-screen')
    .classList.remove('hidden');


  renderSelectorButtons();

  setDefaultServerSelection();

  refreshUI();

}


/* =========================================================
   UI更新
========================================================= */

function refreshUI(){

  updateDisplay();

  renderGameLogTable();

  renderStats();

  updateButtonStates();

  updateUndoButton();

}


/* =========================================================
   選択UI
========================================================= */

function renderSelectorButtons(){

  const container=
    document.getElementById(
      'selector-container'
    );

  container.innerHTML='';


  if(
    modeType==='player' ||
    modeType==='detail'
  ){

    document
      .getElementById(
        'selector-label'
      )
      .innerText=
        '1. ポイントに関与したプレイヤーを選択';


    container.className=
      'btn-grid-4';


    Object.keys(players).forEach(key=>{

      const btn=
        document.createElement('button');

      btn.innerText=
        players[key];

      btn.id=
        `btn-player-${key}`;

      btn.onclick=()=>selectPlayer(key);

      container.appendChild(btn);

    });


  }else{

    document
      .getElementById(
        'selector-label'
      )
      .innerText=
        '1. ポイントに関与したチームを選択';


    container.className=
      'btn-grid-2';


    ['A','B'].forEach(pair=>{

      const btn=
        document.createElement('button');

      btn.innerText=
        `${teamNames[pair]} (${players[pair+'1']} / ${players[pair+'2']})`;

      btn.id=
        `btn-pair-${pair}`;

      btn.onclick=
        ()=>selectPair(pair);

      container.appendChild(btn);

    });

  }

}


function setDefaultServerSelection(){

  const server=
    getCurrentServerKey();


  if(
    modeType==='player' ||
    modeType==='detail'
  ){

    selectPlayer(server);

  }else{

    selectPair(
      server.startsWith('A')
        ? 'A'
        : 'B'
    );

  }

}


function selectPlayer(key){

  selectedPlayer=key;

  Object.keys(players).forEach(k=>{

    const el=
      document.getElementById(
        `btn-player-${k}`
      );

    if(el)
      el.classList.remove('selected');

  });


  const target=
    document.getElementById(
      `btn-player-${key}`
    );

  if(target)
    target.classList.add('selected');


  updateButtonStates();

}


function selectPair(pair){

  selectedPair=pair;

  ['A','B'].forEach(p=>{

    const el=
      document.getElementById(
        `btn-pair-${p}`
      );

    if(el)
      el.classList.remove('selected');

  });


  const target=
    document.getElementById(
      `btn-pair-${pair}`
    );

  if(target)
    target.classList.add('selected');


  updateButtonStates();

}


function updateButtonStates(){

  const ids=[
    'btn-fault',
    'btn-ace',
    'btn-df',
    'btn-returnW',
    'btn-returnE'
  ];

  ids.forEach(id=>{

    const el=
      document.getElementById(id);

    if(el)
      el.disabled=false;

  });


  if(isMatchOver){

    ids.forEach(id=>{

      const el=
        document.getElementById(id);

      if(el)
        el.disabled=true;

    });

    return;

  }


  /*
    サーバー判定。

    重要：
    リターン系はサーブ側が選択されていても
    無効にしない。

    実際のダブルスでは、
    「誰がリターンしたか」を選べる必要があるため。
  */

  const server=
    getCurrentServerKey();


  if(
    modeType==='player' ||
    modeType==='detail'
  ){

    const isServerSelected=
      selectedPlayer===server;

    document.getElementById(
      'btn-fault'
    ).disabled=
      !isServerSelected;

    document.getElementById(
      'btn-ace'
    ).disabled=
      !isServerSelected;

    document.getElementById(
      'btn-df'
    ).disabled=
      !isServerSelected;


    /*
      リターンは常に押せる
    */

    document.getElementById(
      'btn-returnW'
    ).disabled=false;

    document.getElementById(
      'btn-returnE'
    ).disabled=false;


  }else{

    const serverPair=
      server.startsWith('A')
        ? 'A'
        : 'B';

    const isServerSelected=
      selectedPair===serverPair;


    document.getElementById(
      'btn-fault'
    ).disabled=
      !isServerSelected;

    document.getElementById(
      'btn-ace'
    ).disabled=
      !isServerSelected;

    document.getElementById(
      'btn-df'
    ).disabled=
      !isServerSelected;


    document.getElementById(
      'btn-returnW'
    ).disabled=false;

    document.getElementById(
      'btn-returnE'
    ).disabled=false;

  }

}

function selectSide(side){

  document

/* =========================================================
   フォルト
========================================================= */

function handleFault(){

  if(isMatchOver)return;


  /*
    ここで「操作前」の状態を保存。
    これにより、

    1st Fault → Undo

    も完全に戻せる。
  */

  saveHistory();


  const server=
    getCurrentServerKey();


  if(!isSecondServe){

    /*
      1stサーブ失敗
    */

    stats[server].serve1Total++;

    isSecondServe=true;


    /*
      ポイントログにはまだ
      1ポイントを確定させない。

      ただし * を仮ログとして表示する。
    */

    const current=
      gameLogs[
        gameLogs.length-1
      ];


    const marker=
      getDisplayActor(server);

    current.A.push('');
    current.B.push('');

    /*
      1st Fault専用の仮マーカーを
      別管理する代わりに、
      log配列の最後に * を入れる。
    */

    current[
      server.startsWith('A')
        ? 'A'
        : 'B'
    ][
      current[
        server.startsWith('A')
          ? 'A'
          : 'B'
      ].length-1
    ]=
      `*(${marker})`;


    refreshUI();

    return;

  }


  /*
    2ndサーブ失敗
    → DF

    recordPoint()内でも履歴を保存すると
    二重履歴になるので、
    今回は専用処理にする。
  */

  recordDoubleFaultAfterSecondFault();

}


/* =========================================================
   2ndフォルト → DF
========================================================= */

function recordDoubleFaultAfterSecondFault(){

  const server=
    getCurrentServerKey();

  const serverPair=
    server.startsWith('A')
      ? 'A'
      : 'B';


  /*
    直前に1st Faultで
    saveHistory()済み。

    そのためここでは保存しない。
  */


  stats[server].serve2Total++;

  stats[server].df++;


  /*
    1st Faultの仮マーカーを
    DbFへ置き換える（ポイント獲得側の行に記録）
  */

  const current=
    gameLogs[
      gameLogs.length-1
    ];


  const winnerPair = serverPair === 'A' ? 'B' : 'A';
  const index = current.A.length - 1;


  let label = `DbF(${teamNames[serverPair]})`;

  if(modeType!=='simple' && selectedPlayer){
    label = `DbF(${players[server]})`;
  }


  // 仮マーカーが置かれていた列の、勝利チーム側にDbFを記録する
  current.A[index] = (winnerPair === 'A') ? label : '';
  current.B[index] = (winnerPair === 'B') ? label : '';


  /*
    ポイント勝者は相手。
  */

  addPoint(winnerPair);


  isSecondServe=false;

  selectedSide='';


  clearSideSelection();


  refreshUI();


  if(!isMatchOver){

    setDefaultServerSelection();

    refreshUI();

  }

}


/* =========================================================
   アクション
========================================================= */

function recordPoint(action){

  if(isMatchOver)return;


  /*
    ここで操作前状態保存。

    これがUndoの本体。
  */

  saveHistory();


  const server=
    getCurrentServerKey();


  /*
    既に1st Faultが存在する場合、
    通常アクションは2nd Serveとして処理。
  */


  /* -------------------------
     サーブ統計
  ------------------------- */

  if(action==='ダブルフォルト'){

    /*
      手動DFボタンを押した場合。

      1st Fault済みなら1st totalは
      既に増えているので増やさない。
    */

    if(!isSecondServe){

      stats[server].serve1Total++;

    }

    stats[server].serve2Total++;

    stats[server].df++;


  }else{

    if(!isSecondServe){

      stats[server].serve1Total++;

      stats[server].serve1In++;

    }else{

      stats[server].serve2Total++;

      stats[server].serve2In++;

    }

  }


  /* -------------------------
     個人スタッツ
  ------------------------- */

  if(
    modeType!=='simple' &&
    selectedPlayer
  ){

    if(action==='サービスエース')
      stats[selectedPlayer].ace++;

    if(action==='ストロークウィナー')
      stats[selectedPlayer].strokeW++;

    if(action==='ストロークエラー')
      stats[selectedPlayer].strokeE++;

    if(action==='ボレーウィナー')
      stats[selectedPlayer].volleyW++;

    if(action==='ボレーエラー')
      stats[selectedPlayer].volleyE++;

    if(action==='リターンエース')
      stats[selectedPlayer].returnW++;

    if(action==='リターンエラー')
      stats[selectedPlayer].returnE++;

  }


  /*
    既に1st Faultを仮ログに入れている場合は、
    その列を再利用する。

    これで

    *  → StW

    のように1ポイント1列になる。
  */

  const current=
    gameLogs[
      gameLogs.length-1
    ];


  const faultAlreadyLogged=
    isSecondServe &&
    current.A.length>0 &&
    (
      current.A[current.A.length-1].startsWith('*') ||
      current.B[current.B.length-1].startsWith('*')
    );


  const winnerPair=
    getWinnerPair(action);


  let abbr=
    getActionAbbr(action);


  /*
    詳細モード
    F/B追加
  */

  if(
    modeType==='detail' &&
    selectedSide
  ){

    abbr+=
      `(${selectedSide==='フォア'
        ? 'F'
        : 'B'})`;

  }


  /*
    誰のプレーか
  */

  if(action==='ダブルフォルト'){
    // ダブルフォルトの場合はサーブ側の名前をラベルに入れる
    if(modeType!=='simple' && selectedPlayer){
      abbr += `(${players[server]})`;
    } else {
      const serverPair = server.startsWith('A') ? 'A' : 'B';
      abbr += `(${teamNames[serverPair]})`;
    }
  } else if(
    modeType!=='simple' &&
    selectedPlayer
  ){

    abbr+=
      `(${players[selectedPlayer]})`;

  }else{

    const actorPair= winnerPair;

    abbr+=
      `(${teamNames[actorPair]})`;

  }


  /*
    ログ格納
  */

  if(faultAlreadyLogged){

    /*
      既存の * を削除して
      2ndサーブ結果へ置換
      (フォルトの場合はポイント取得側＝相手側に置く)
    */

    const index = current.A.length - 1;
    current.A[index] = (winnerPair === 'A') ? abbr : '';
    current.B[index] = (winnerPair === 'B') ? abbr : '';

  }else{

    current.A.push(
      winnerPair==='A'
        ? abbr
        : ''
    );

    current.B.push(
      winnerPair==='B'
        ? abbr
        : ''
    );

  }


  /*
    ポイント加算
  */

  addPoint(winnerPair);


  /*
    次のポイント
  */

  isSecondServe=false;

  selectedSide='';

  clearSideSelection();


  refreshUI();


  if(!isMatchOver){

    setDefaultServerSelection();

    refreshUI();

  }

}


/* =========================================================
   アクション略称
========================================================= */

function getActionAbbr(action){

  switch(action){

    case 'サービスエース':
      return 'SvA';

    case 'ダブルフォルト':
      return 'DbF';

    case 'ストロークウィナー':
      return 'StW';

    case 'ストロークエラー':
      return 'StE';

    case 'ボレーウィナー':
      return 'VoW';

    case 'ボレーエラー':
      return 'VoE';

    case 'リターンエース':
      return 'RtA';

    case 'リターンエラー':
      return 'RtE';

    default:
      return action;

  }

}


/* =========================================================
   選択者表示
========================================================= */

function getDisplayActor(server){

  if(modeType==='simple'){

    return teamNames[
      server.startsWith('A')
        ? 'A'
        : 'B'
    ];

  }

  return players[server];

}


/* =========================================================
   ポイント勝者
========================================================= */

function getWinnerPair(action){

  /*
    DF
    → サーバー側が失点
  */

  if(action==='ダブルフォルト'){

    return getCurrentServerKey()
      .startsWith('A')
      ? 'B'
      : 'A';

  }


  /*
    エラー
    → エラーした選手/ペアが失点
  */

  if(action.includes('エラー')){

    if(modeType!=='simple'){

      if(!selectedPlayer){

        const sp=
          getCurrentServerKey()
            .startsWith('A')
            ? 'A'
            : 'B';

        return sp==='A'
          ? 'B'
          : 'A';

      }

      const pp=
        selectedPlayer.startsWith('A')
          ? 'A'
          : 'B';

      return pp==='A'
        ? 'B'
        : 'A';

    }


    if(!selectedPair){

      const sp=
        getCurrentServerKey()
          .startsWith('A')
          ? 'A'
          : 'B';

      return sp==='A'
        ? 'B'
        : 'A';

    }

    return selectedPair==='A'
      ? 'B'
      : 'A';

  }


  /*
    ウィナー
  */

  if(modeType!=='simple'){

    if(!selectedPlayer){

      return getCurrentServerKey()
        .startsWith('A')
        ? 'A'
        : 'B';

    }

    return selectedPlayer.startsWith('A')
      ? 'A'
      : 'B';

  }


  return selectedPair ||
    (
      getCurrentServerKey()
        .startsWith('A')
        ? 'A'
        : 'B'
    );

}


/* =========================================================
   ポイント → ゲーム
========================================================= */

function addPoint(pair){

  points[pair]++;

  const other=
    pair==='A'
      ? 'B'
      : 'A';

  let gameWon=false;


  if(rule==='6noadd'){

    if(
      points[pair]>=4 &&
      points[pair]!==points[other]
    ){

      gameWon=true;

    }

  }


  else if(rule==='6semiadd'){

    if(
      points[pair]>=4 &&
      points[pair]-points[other]>=1
    ){

      gameWon=true;

    }

  }


  else if(rule==='1set'){

    if(
      points[pair]>=4 &&
      points[pair]-points[other]>=2
    ){

      gameWon=true;

    }

  }


  if(gameWon){

    games[pair]++;

    points.A=0;
    points.B=0;

    onGameEnd();

  }

}


/* =========================================================
   ゲーム終了
========================================================= */

function onGameEnd(){

  /*
    ノーアド
  */

  if(
    rule==='6noadd' &&
    (games.A===6 || games.B===6) &&
    games.A!==games.B
  ){

    endMatch(
      games.A>games.B
        ? `${teamNames.A}の勝利！`
        : `${teamNames.B}の勝利！`
    );

    return;

  }


  /*
    通常6ゲーム先取
  */

  if(
    rule!=='6noadd' &&
    (
      (
        games.A>=6 &&
        games.A-games.B>=2
      )
      ||
      (
        games.B>=6 &&
        games.B-games.A>=2
      )
    )
  ){

    endMatch(
      games.A>games.B
        ? `${teamNames.A}の勝利！`
        : `${teamNames.B}の勝利！`
    );

    return;

  }


  /*
    次ゲームログ
  */

  gameLogs.push({
    A:[],
    B:[]
  });


  const totalGames=
    games.A+games.B;


  /*
    2ゲーム目
  */

  if(
    totalGames===1 &&
    serveOrder.length<2
  ){

    showSecondServerModal();

  }else{

    currentServerIdx=
      (currentServerIdx+1)%4;

    setDefaultServerSelection();

  }

}


/* =========================================================
   試合終了
========================================================= */

function endMatch(message){

  isMatchOver=true;

  document
    .getElementById('serve-info')
    .innerText=
      `試合終了: ${message}`;

  document
    .getElementById('serve-info')
    .style.color=
      '#38bdf8';

}


/* =========================================================
   2ゲーム目サーバー
========================================================= */

function showSecondServerModal(){

  const first=
    serveOrder[0];

  const isA=
    first.startsWith('A');

  const targetPair=
    isA
      ? ['B1','B2']
      : ['A1','A2'];


  const select=
    document.getElementById(
      'second-server-select'
    );


  select.innerHTML=`

    <option value="${targetPair[0]}">
      ${players[targetPair[0]]}
    </option>

    <option value="${targetPair[1]}">
      ${players[targetPair[1]]}
    </option>

  `;


  document
    .getElementById('server-modal')
    .classList.remove('hidden');

}


function confirmSecondServer(){

  /*
    モーダル決定前の状態を保存。

    Undoすれば2ゲーム目サーバー選択前に戻る。
  */

  saveHistory();


  const secondServer=
    document.getElementById(
      'second-server-select'
    ).value;


  serveOrder[1]=secondServer;


  const first=serveOrder[0];

  const second=serveOrder[1];


  serveOrder[2]=
    first.endsWith('1')
      ? first.slice(0,1)+'2'
      : first.slice(0,1)+'1';


  serveOrder[3]=
    second.endsWith('1')
      ? second.slice(0,1)+'2'
      : second.slice(0,1)+'1';


  document
    .getElementById('server-modal')
    .classList.add('hidden');


  currentServerIdx=1;

  setDefaultServerSelection();

  refreshUI();

}

   現在サーバー
========================================================= */

function getCurrentServerKey(){

  return serveOrder[currentServerIdx] ||
         serveOrder[0];

}

function updateDisplay(){

  document
    .getElementById('game-score')

/* =========================================================
   ログ
========================================================= */

function renderGameLogTable(){

  const headerRow=
    document.getElementById(
      'log-header-row'
    );

  const tbody=
    document.getElementById(
      'game-log-tbody'
    );


  let maxCols=8;


  gameLogs.forEach(g=>{

    maxCols=
      Math.max(
        maxCols,
        g.A.length,
        g.B.length
      );

  });


  let headerHtml=`

    <th class="col-game">
      ゲーム
    </th>

    <th class="col-team">
      チーム
    </th>

  `;


  for(
    let i=1;
    i<=maxCols;
    i++
  ){

    headerHtml+=
      `<th>${i}</th>`;

  }


  headerRow.innerHTML=
    headerHtml;


  let html='';


  gameLogs.forEach((g,index)=>{

    const gameNum=index+1;


    html+=`

      <tr>

        <td
          rowspan="2"
          class="col-game"
          style="vertical-align:middle">

          ${gameNum}

        </td>

        <td class="col-team">
          ${teamNames.A}
        </td>

    `;


    for(
      let i=0;
      i<maxCols;
      i++
    ){

      html+=`
        <td>
          ${g.A[i] || ''}
        </td>
      `;

    }


    html+='</tr>';


    html+=`

      <tr>

        <td class="col-team">
          ${teamNames.B}
        </td>

    `;


    for(
      let i=0;
      i<maxCols;
      i++
    ){

      html+=`
        <td>
          ${g.B[i] || ''}
        </td>
      `;

    }


    html+='</tr>';

  });


  tbody.innerHTML=html;

}


/* =========================================================
   スタッツ
========================================================= */

function getPairStat(pair,key){

  return (
    stats[pair+'1'][key] +
    stats[pair+'2'][key]
  );

}


function getServePct(inCount,total){

  return total===0
    ? '0%'
    : Math.round(
        inCount/total*100
      )+'%';

}
