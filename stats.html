<!DOCTYPE html>

<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>テニススタッツ計測ツール</title>

<style>
:root{
  --primary:#2563eb;
  --primary-dark:#1d4ed8;
  --bg:#f8fafc;
  --card:#fff;
  --text:#1e293b;
  --muted:#64748b;
  --border:#e2e8f0;
  --danger:#f59e0b;
}

*{box-sizing:border-box}

body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;
  background:var(--bg);
  color:var(--text);
  margin:0;
  padding:10px;
  -webkit-tap-highlight-color:transparent;
}

.container{
  width:100%;
  max-width:850px;
  margin:0 auto;
}

.card{
  background:var(--card);
  border-radius:10px;
  padding:14px;
  margin-bottom:10px;
  border:1px solid var(--border);
  box-shadow:0 1px 3px rgba(0,0,0,.05);
}

h2,h3{
  margin:0 0 10px;
  text-align:center;
}

label{
  font-size:.9rem;
}

input[type=text],
input[type=date],
select{
  width:100%;
  padding:10px;
  margin:4px 0 8px;
  border:1px solid var(--border);
  border-radius:6px;
  font-size:16px;
  background:#fff;
}

button{
  padding:12px 8px;
  font-size:.92rem;
  font-weight:bold;
  border-radius:7px;
  border:1px solid #cbd5e1;
  background:#f1f5f9;
  color:var(--text);
  cursor:pointer;
  touch-action:manipulation;
  min-height:46px;
}

button:active{
  transform:scale(.98);
}

button.selected{
  background:var(--primary)!important;
  color:#fff!important;
  border-color:var(--primary)!important;
}

button.action-btn{
  background:#fff;
  border:2px solid #cbd5e1;
}

button.fault-btn{
  background:#fef3c7;
  border-color:#f59e0b;
  color:#b45309;
  grid-column:span 2;
}

button:disabled{
  opacity:.38;
  cursor:not-allowed;
  transform:none!important;
}

.btn-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:7px;
}

.btn-grid-4{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:6px;
}

.btn-grid-2{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:7px;
}

.action-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:7px;
}

.hidden{
  display:none!important;
}

/* =====================
   スコア
===================== */

.scoreboard{
  background:#0f172a;
  color:#fff;
  padding:14px;
  border-radius:10px;
  text-align:center;
}

.match-date{
  font-size:.8rem;
  color:#38bdf8;
  margin-bottom:3px;
}

.score-sets{
  font-size:1rem;
  color:#94a3b8;
  margin-bottom:3px;
}

.score-main{
  font-size:2rem;
  font-weight:bold;
  letter-spacing:2px;
  color:#38bdf8;
}

.serve-status{
  font-size:.85rem;
  margin-top:5px;
  color:#fde047;
  min-height:20px;
}

.control-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
  margin-bottom:8px;
}

.undo-btn{
  background:#fff;
  border:2px solid #94a3b8;
}

.save-btn{
  background:var(--primary);
  color:#fff;
  border-color:var(--primary);
}

/* =====================
   ログ
===================== */

.log-table-container{
  overflow-x:auto;
  -webkit-overflow-scrolling:touch;
  margin-bottom:4px;
}

table{
  border-collapse:collapse;
  font-size:.78rem;
  text-align:center;
  width:100%;
}

th,td{
  border:1px solid var(--border);
  padding:6px 5px;
  background:#fff;
}

th{
  background:#f1f5f9;
  font-weight:bold;
}

.log-table{
  min-width:620px;
}

.log-table th,
.log-table td{
  white-space:nowrap;
  min-width:55px;
}

.log-table th.col-game,
.log-table td.col-game{
  position:sticky;
  left:0;
  z-index:10;
  width:45px;
  min-width:45px;
  font-weight:bold;
  background:#f1f5f9;
}

.log-table th.col-team,
.log-table td.col-team{
  position:sticky;
  left:45px;
  z-index:10;
  width:85px;
  min-width:85px;
  font-weight:bold;
  background:#f1f5f9;
}

.log-table tbody td.col-game,
.log-table tbody td.col-team{
  background:#f8fafc;
}

/* =====================
   スタッツ
===================== */

.stats-table{
  min-width:600px;
}

.stats-container{
  overflow-x:auto;
  -webkit-overflow-scrolling:touch;
}

.stats-table td:first-child,
.stats-table th:first-child{
  position:sticky;
  left:0;
  z-index:5;
  background:#f1f5f9;
  font-weight:bold;
}

/* =====================
   モーダル
===================== */

.modal{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,.6);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:100;
  padding:15px;
}

.modal-content{
  background:#fff;
  padding:20px;
  border-radius:10px;
  width:100%;
  max-width:400px;
}

/* =====================
   画像保存用
===================== */

.export-area{
  position:absolute;
  left:-100000px;
  top:0;
  width:900px;
  background:#fff;
  color:#111;
  padding:25px;
}

.export-title{
  font-size:24px;
  font-weight:bold;
  text-align:center;
  margin-bottom:8px;
}

.export-score{
  text-align:center;
  font-size:20px;
  font-weight:bold;
  margin-bottom:15px;
}

.export-section-title{
  font-size:17px;
  font-weight:bold;
  margin:15px 0 7px;
}

.export-area table{
  width:100%;
  border-collapse:collapse;
  font-size:12px;
}

.export-area th,
.export-area td{
  border:1px solid #999;
  padding:6px;
  text-align:center;
}

.export-area th{
  background:#eee;
}

/* =====================
   PC
===================== */

@media(min-width:700px){
  body{
    padding:18px;
  }

  .card{
    padding:16px;
  }

  button{
    min-height:44px;
  }
}

/* =====================
   印刷
===================== */

@media print{
  body{
    background:#fff;
    padding:0;
  }

  .no-print{
    display:none!important;
  }

  .card{
    border:none;
    box-shadow:none;
    padding:4px;
    margin-bottom:8px;
  }

  .scoreboard{
    background:#000!important;
    color:#fff!important;
    -webkit-print-color-adjust:exact;
    print-color-adjust:exact;
  }
}
</style>

</head>

<!-- html2canvas -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<script>

/* =========================================================
   STATE
========================================================= */

let teamNames = {
  A:'ペアA',
  B:'ペアB'
};

let players = {
  A1:'',
  A2:'',
  B1:'',
  B2:''
};

let rule = '6noadd';

let serveOrder = [];
let currentServerIdx = 0;

let isSecondServe = false;
let pendingFirstFault = false;

let matchDateStr = '';
let modeType = 'simple';

let games = {
  A:0,
  B:0
};

let points = {
  A:0,
  B:0
};

let selectedPlayer = null;
let selectedPair = null;
let selectedSide = '';

let isMatchOver = false;

let stats = {};
let gameLogs = [];

/* Undo用 */
let history = [];


/* =========================================================
   初期化
========================================================= */

window.onload = function(){

  const saved =
    localStorage.getItem('tennis_tool_settings');

  if(saved){

    try{

      const data = JSON.parse(saved);

      if(data.teamA)
        document.getElementById('teamA-name').value = data.teamA;

      if(data.teamB)
        document.getElementById('teamB-name').value = data.teamB;

      if(data.pA1)
        document.getElementById('pA1').value = data.pA1;

      if(data.pA2)
        document.getElementById('pA2').value = data.pA2;

      if(data.pB1)
        document.getElementById('pB1').value = data.pB1;

      if(data.pB2)
        document.getElementById('pB2').value = data.pB2;

    }catch(e){}

  }


  const today = new Date();

  const yyyy = today.getFullYear();
  const mm = String(today.getMonth()+1).padStart(2,'0');
  const dd = String(today.getDate()).padStart(2,'0');

  document.getElementById('match-date-input').value =
    `${yyyy}-${mm}-${dd}`;


  updateSetupOptions();


  [
    'teamA-name',
    'teamB-name',
    'pA1',
    'pA2',
    'pB1',
    'pB2'
  ].forEach(id=>{

    document
      .getElementById(id)
      .addEventListener('input',updateSetupOptions);

  });

};


/* =========================================================
   初期設定のサーバー選択肢
========================================================= */

function updateSetupOptions(){

  const tA =
    document.getElementById('teamA-name').value || 'ペアA';

  const tB =
    document.getElementById('teamB-name').value || 'ペアB';

  const pA1 =
    document.getElementById('pA1').value || '選手A';

  const pA2 =
    document.getElementById('pA2').value || '選手a';

  const pB1 =
    document.getElementById('pB1').value || '選手B';

  const pB2 =
    document.getElementById('pB2').value || '選手b';


  document.getElementById('first-server').innerHTML = `

    <option value="A1">
      ${escapeHtml(pA1)} (${escapeHtml(tA)})
    </option>

    <option value="A2">
      ${escapeHtml(pA2)} (${escapeHtml(tA)})
    </option>

    <option value="B1">
      ${escapeHtml(pB1)} (${escapeHtml(tB)})
    </option>

    <option value="B2">
      ${escapeHtml(pB2)} (${escapeHtml(tB)})
    </option>

  `;

}


/* =========================================================
   試合開始
========================================================= */

function startGame(){

  teamNames.A =
    document.getElementById('teamA-name').value || 'ペアA';

  teamNames.B =
    document.getElementById('teamB-name').value || 'ペアB';

  players.A1 =
    document.getElementById('pA1').value || '選手A';

  players.A2 =
    document.getElementById('pA2').value || '選手a';

  players.B1 =
    document.getElementById('pB1').value || '選手B';

  players.B2 =
    document.getElementById('pB2').value || '選手b';

  rule =
    document.getElementById('rule-select').value;

  modeType =
    document.querySelector(
      'input[name="mode-type"]:checked'
    ).value;

  matchDateStr =
    document.getElementById('match-date-input').value;


  localStorage.setItem(
    'tennis_tool_settings',
    JSON.stringify({
      teamA:teamNames.A,
      teamB:teamNames.B,
      pA1:players.A1,
      pA2:players.A2,
      pB1:players.B1,
      pB2:players.B2
    })
  );


  serveOrder = [
    document.getElementById('first-server').value
  ];

  currentServerIdx = 0;

  isSecondServe = false;
  pendingFirstFault = false;

  games = {
    A:0,
    B:0
  };

  points = {
    A:0,
    B:0
  };

  gameLogs = [
    {
      A:[],
      B:[]
    }
  ];

  history = [];

  isMatchOver = false;

  selectedPlayer = null;
  selectedPair = null;
  selectedSide = '';


  stats = {};

  Object.keys(players).forEach(p=>{

    stats[p] = {

      serve1In:0,
      serve1Total:0,

      serve2In:0,
      serve2Total:0,

      ace:0,
      df:0,

      strokeW:0,
      strokeE:0,

      volleyW:0,
      volleyE:0,

      returnW:0,
      returnE:0

    };

  });


  document.getElementById('display-match-date').innerText =
    matchDateStr;


  if(modeType === 'detail'){

    document
      .getElementById('detail-card')
      .classList.remove('hidden');

  }else{

    document
      .getElementById('detail-card')
      .classList.add('hidden');

  }


  document
    .getElementById('setup-screen')
    .classList.add('hidden');

  document
    .getElementById('match-screen')
    .classList.remove('hidden');


  renderSelectorButtons();

  setDefaultServerSelection();

  refreshUI();

}


/* =========================================================
   Snapshot / Undo
========================================================= */

function createSnapshot(){

  return {
    games:JSON.parse(JSON.stringify(games)),
    points:JSON.parse(JSON.stringify(points)),
    stats:JSON.parse(JSON.stringify(stats)),
    gameLogs:JSON.parse(JSON.stringify(gameLogs)),

    serveOrder:[...serveOrder],
    currentServerIdx:currentServerIdx,

    isSecondServe:isSecondServe,
    pendingFirstFault:pendingFirstFault,

    selectedPlayer:selectedPlayer,
    selectedPair:selectedPair,
    selectedSide:selectedSide,

    isMatchOver:isMatchOver
  };

}


function restoreSnapshot(s){

  games = JSON.parse(JSON.stringify(s.games));
  points = JSON.parse(JSON.stringify(s.points));
  stats = JSON.parse(JSON.stringify(s.stats));
  gameLogs = JSON.parse(JSON.stringify(s.gameLogs));

  serveOrder = [...s.serveOrder];
  currentServerIdx = s.currentServerIdx;

  isSecondServe = s.isSecondServe;
  pendingFirstFault = s.pendingFirstFault;

  selectedPlayer = s.selectedPlayer;
  selectedPair = s.selectedPair;
  selectedSide = s.selectedSide;

  isMatchOver = s.isMatchOver;

  document
    .getElementById('server-modal')
    .classList.add('hidden');

  clearSideSelection();

  refreshUI();

}


function pushHistory(){

  history.push(createSnapshot());

  /* 無限に増えないように */
  if(history.length > 100){
    history.shift();
  }

}


function undoLast(){

  if(history.length === 0){
    return;
  }

  const previous =
    history.pop();

  restoreSnapshot(previous);

}


/* =========================================================
   UI
========================================================= */

function refreshUI(){

  updateDisplay();

  renderGameLogTable();

  renderStats();

  updateButtonStates();

  document.getElementById('btn-undo').disabled =
    history.length === 0;

}


/* =========================================================
   選択UI
========================================================= */

function renderSelectorButtons(){

  const container =
    document.getElementById('selector-container');

  container.innerHTML = '';


  if(
    modeType === 'player' ||
    modeType === 'detail'
  ){

    document
      .getElementById('selector-label')
      .innerText =
      '1. ポイントに関与したプレイヤーを選択';

    container.className =
      'btn-grid-4';


    Object.keys(players).forEach(key=>{

      const btn =
        document.createElement('button');

      btn.innerText =
        players[key];

      btn.id =
        `btn-player-${key}`;

      btn.onclick =
        ()=>selectPlayer(key);

      container.appendChild(btn);

    });


  }else{

    document
      .getElementById('selector-label')
      .innerText =

function clearSideSelection(){

  if(back)

/* =========================================================
   ボタン状態
========================================================= */

function updateButtonStates(){

  const fault =
    document.getElementById('btn-fault');

  const ace =
    document.getElementById('btn-ace');

  const df =
    document.getElementById('btn-df');

  const returnW =
    document.getElementById('btn-returnW');

  const returnE =
    document.getElementById('btn-returnE');


  fault.disabled = false;
  ace.disabled = false;
  df.disabled = false;

  /*
   * リターンはサーブ中でも常に押せる
   */
  returnW.disabled = false;
  returnE.disabled = false;


  if(isMatchOver){

    fault.disabled = true;
    ace.disabled = true;
    df.disabled = true;
    returnW.disabled = true;
    returnE.disabled = true;

    return;

  }


  /*
   * サーブ系だけサーバー選択時に限定
   */

  if(
    modeType === 'player' ||
    modeType === 'detail'
  ){

    const server =
      getCurrentServerKey();

    const serverSelected =
      selectedPlayer === server;

    fault.disabled =
      !serverSelected;

    ace.disabled =
      !serverSelected;

    df.disabled =
      !serverSelected;

  }else{

    const serverPair =
      getCurrentServerKey().startsWith('A')
        ? 'A'
        : 'B';

    const serverSelected =
      selectedPair === serverPair;

    fault.disabled =
      !serverSelected;

    ace.disabled =
      !serverSelected;

    df.disabled =
      !serverSelected;

  }


  /*
   * 2ndサーブ中はFaultボタンを押させない
   */
  if(isSecondServe){
    fault.disabled = true;
  }

}


/* =========================================================
   Fault
========================================================= */

function handleFault(){

  if(isMatchOver)
    return;

  if(isSecondServe)
    return;


  pushHistory();

  const server =
    getCurrentServerKey();


  /*
   * 1st serve失敗
   */

  stats[server].serve1Total++;

  isSecondServe = true;

  pendingFirstFault = true;


  refreshUI();

}


/* =========================================================
   Action
========================================================= */

function getActionAbbr(action){

  switch(action){

    case 'サービスエース':
      return 'SvA';

    case 'ダブルフォルト':
      return 'DbF';

    case 'ストロークウィナー':
      return 'StW';

    case 'ストロークエラー':
      return 'StE';

    case 'ボレーウィナー':
      return 'VoW';

    case 'ボレーエラー':
      return 'VoE';

    case 'リターンエース':
      return 'RtA';

    case 'リターンエラー':
      return 'RtE';

    default:
      return action;

  }

}


/* =========================================================
   Point
========================================================= */

function recordPoint(action){

  if(isMatchOver)
    return;


  /*
   * サーバー
   */

  const server =
    getCurrentServerKey();


  /*
   * 選択されているプレイヤー/ペア
   */

  const actorPair =
    getActorPair();


  /*
   * DFはサーバー側が必ず実行者
   */

  if(action === 'ダブルフォルト'){

    /*
     * まだ1st faultを押していない場合でも
     * 1st/2ndの両方を消費
     */

    if(!isSecondServe){

      stats[server].serve1Total++;

    }

    stats[server].serve2Total++;

    stats[server].df++;

  }else{

    /*
     * サーブ系アクションならサーブインを記録
     */

    if(action === 'サービスエース'){

      if(!isSecondServe){

        stats[server].serve1Total++;
        stats[server].serve1In++;

      }else{

        stats[server].serve2Total++;
        stats[server].serve2In++;

      }

    }

  }


  /*
   * 個人スタッツ
   */

  if(
    modeType !== 'simple' &&
    selectedPlayer
  ){

    const p =
      selectedPlayer;


    if(action === 'サービスエース')
      stats[p].ace++;

    if(action === 'ストロークウィナー')
      stats[p].strokeW++;

    if(action === 'ストロークエラー')
      stats[p].strokeE++;

    if(action === 'ボレーウィナー')
      stats[p].volleyW++;

    if(action === 'ボレーエラー')
      stats[p].volleyE++;

    if(action === 'リターンエース')
      stats[p].returnW++;

    if(action === 'リターンエラー')
      stats[p].returnE++;

  }


  /*
   * DF以外の通常ポイントでは
   * 選択された選手/ペアをアクターとする。
   *
   * DFだけはサーバーがアクター。
   */

  let actualActorPair =
    actorPair;

  if(action === 'ダブルフォルト'){

    actualActorPair =
      server.startsWith('A') ? 'A' : 'B';

  }


  /*
   * ポイント勝者
   */

  const winnerPair =
    getWinnerPair(
      action,
      actualActorPair
    );


  /*
   * ログ
   */

  let abbr =
    getActionAbbr(action);


  /*
   * 1st faultがあったポイントには *
   */

  if(pendingFirstFault){

    abbr =
      '*' + abbr;

  }


  /*
   * 詳細モードならフォア/バック
   *
   * DFには付けない
   */

  if(
    modeType === 'detail' &&
    selectedSide &&
    action !== 'ダブルフォルト'
  ){

    abbr +=
      `(${selectedSide === 'フォア' ? 'F' : 'B'})`;

  }


  /*
   * 誰が関与したか
   */

  if(action === 'ダブルフォルト'){

    /*
     * 例:
     * AがDF
     * → B側ログに DbF(ペアA)
     */

    abbr +=
      `(${actualActorPair === 'A'
        ? teamNames.A
        : teamNames.B})`;

  }else{

    if(
      modeType !== 'simple' &&
      selectedPlayer
    ){

      abbr +=
        `(${players[selectedPlayer]})`;

    }else{

      abbr +=
        `(${actualActorPair === 'A'
          ? teamNames.A
          : teamNames.B})`;

    }

  }


  /*
   * ログ追加
   */

  const currentGame =
    gameLogs[gameLogs.length-1];


  if(winnerPair === 'A'){

    currentGame.A.push(abbr);
    currentGame.B.push('');

  }else{

    currentGame.A.push('');
    currentGame.B.push(abbr);

  }


  /*
   * ポイント加算
   */

  addPoint(winnerPair);


  /*
   * 次ポイント
   */

  isSecondServe = false;
  pendingFirstFault = false;

  clearSideSelection();


  /*
   * 試合終了していなければ
   * 次のサーバー選択
   */

  if(!isMatchOver){

    setDefaultServerSelection();

  }


  refreshUI();

}


/* =========================================================
   Actor
========================================================= */

function getActorPair(){

  if(
    modeType !== 'simple' &&
    selectedPlayer
  ){

    return selectedPlayer.startsWith('A')
      ? 'A'
      : 'B';

  }


  if(selectedPair){

    return selectedPair;

  }


  return getCurrentServerKey().startsWith('A')
    ? 'A'
    : 'B';

}


/* =========================================================
   Winner
========================================================= */

function getWinnerPair(action,actorPair){

  /*
   * DF / エラー
   * → アクター側が失点
   */

  if(
    action === 'ダブルフォルト' ||
    action.includes('エラー')
  ){

    return actorPair === 'A'
      ? 'B'
      : 'A';

  }


  /*
   * ウィナー系
   * → アクター側が得点
   */

  return actorPair;

}


/* =========================================================
   Game
========================================================= */

function addPoint(pair){

  points[pair]++;

  let gameWon = false;

  const opponent =
    pair === 'A' ? 'B' : 'A';


  /*
   * ノーアド
   */

  if(rule === '6noadd'){

    if(
      points[pair] >= 4 &&
      points[pair] !== points[opponent]
    ){

      gameWon = true;

    }

  }


  /*
   * セミアド
   */

  else if(rule === '6semiadd'){

    if(
      points[pair] >= 4 &&
      points[pair] - points[opponent] >= 1
    ){

      gameWon = true;

    }

  }


  /*
   * 通常
   */

  else if(rule === '1set'){

    if(
      points[pair] >= 4 &&
      points[pair] - points[opponent] >= 2
    ){

      gameWon = true;

    }

  }


  if(gameWon){

    games[pair]++;

    points.A = 0;
    points.B = 0;

    onGameEnd();

  }

}


/* =========================================================
   Game End
========================================================= */

function onGameEnd(){

  /*
   * 6ゲーム先取
   */

  if(
    games.A >= 6 &&
    games.A - games.B >= 2
  ){

    endMatch(
      `${teamNames.A}の勝利！`
    );

    return;

  }


  if(
    games.B >= 6 &&
    games.B - games.A >= 2
  ){

    endMatch(
      `${teamNames.B}の勝利！`
    );

    return;

  }


  /*
   * ノーアド
   */

  if(
    rule === '6noadd' &&
    (games.A === 6 || games.B === 6) &&
    games.A !== games.B
  ){

    endMatch(
      games.A > games.B
        ? `${teamNames.A}の勝利！`
        : `${teamNames.B}の勝利！`
    );

    return;

  }


  /*
   * 次ゲーム
   */

  gameLogs.push({
    A:[],
    B:[]
  });


  const totalGames =
    games.A + games.B;


  /*
   * 2ゲーム目
   */

  if(
    totalGames === 1 &&
    serveOrder.length < 2
  ){

    showSecondServerModal();

  }else{

    currentServerIdx =
      (currentServerIdx + 1) % 4;

    setDefaultServerSelection();

  }

}


/* =========================================================
   Match End
========================================================= */

function endMatch(message){

  isMatchOver = true;

  document.getElementById('serve-info').innerText =
    `試合終了: ${message}`;

  document.getElementById('serve-info').style.color =
    '#38bdf8';

}


/* =========================================================
   Server
========================================================= */

function showSecondServerModal(){

  const firstServer =
    serveOrder[0];

  const isA =
    firstServer.startsWith('A');

  const targetPair =
    isA
      ? ['B1','B2']
      : ['A1','A2'];


  document.getElementById('second-server-select').innerHTML = `

    <option value="${targetPair[0]}">
      ${escapeHtml(players[targetPair[0]])}
    </option>

    <option value="${targetPair[1]}">
      ${escapeHtml(players[targetPair[1]])}
    </option>

  `;


  document
    .getElementById('server-modal')
    .classList.remove('hidden');

}


function confirmSecondServer(){

  const secondServer =
    document.getElementById('second-server-select').value;


  serveOrder[1] =
    secondServer;


  const first =
    serveOrder[0];

  const second =
    serveOrder[1];


  serveOrder[2] =
    first.endsWith('1')
      ? first.slice(0,1)+'2'
      : first.slice(0,1)+'1';


  serveOrder[3] =
    second.endsWith('1')
      ? second.slice(0,1)+'2'
      : second.slice(0,1)+'1';


  document
    .getElementById('server-modal')
    .classList.add('hidden');


  currentServerIdx = 1;

  setDefaultServerSelection();

  refreshUI();

}


function getCurrentServerKey(){

  return (
    serveOrder[currentServerIdx] ||
    serveOrder[0]
  );

}


/* =========================================================
   Display
========================================================= */

function updateDisplay(){

  document.getElementById('game-score').innerText =
    `ゲームスコア: ${teamNames.A} ${games.A} - ${games.B} ${teamNames.B}`;


  document.getElementById('point-score').innerText =
    `${pointLabel(points.A)} - ${pointLabel(points.B)}`;


  if(!isMatchOver){

    const server =
      getCurrentServerKey();

    const serverName =
      players[server] || '未定';


    let state =
      isSecondServe
        ? '2nd Serve'
        : '1st Serve';


    if(pendingFirstFault){

      state += '（1st Fault済）';

    }


    document.getElementById('serve-info').innerText =
      `サーバー: ${serverName} (${state})`;

    document.getElementById('serve-info').style.color =
      '#fde047';

  }

}


function pointLabel(p){

  const labels =
    ['0','15','30','40'];

  return labels[p] || p;

/* =========================================================
   Log Table
========================================================= */

function renderGameLogTable(){

  const headerRow =
    document.getElementById('log-header-row');

  const tbody =
    document.getElementById('game-log-tbody');


  let maxCols = 8;


  gameLogs.forEach(g=>{

    maxCols =
      Math.max(
        maxCols,
        g.A.length,
        g.B.length
      );

  });


  let header =
    '<th class="col-game">ゲーム</th>' +
    '<th class="col-team">チーム</th>';


  for(let i=1;i<=maxCols;i++){

    header +=
      `<th>${i}</th>`;

  }


  headerRow.innerHTML =
    header;


  let html = '';


  gameLogs.forEach((g,index)=>{

    const gameNum =
      index + 1;


    html += '<tr>';

    html +=
      `<td rowspan="2" class="col-game"
       style="vertical-align:middle;">
       ${gameNum}
       </td>`;


    html +=
      `<td class="col-team">
       ${escapeHtml(teamNames.A)}
       </td>`;


    for(let i=0;i<maxCols;i++){

      html +=
        `<td>${escapeHtml(g.A[i] || '')}</td>`;

    }

    html += '</tr>';


    html += '<tr>';

    html +=
      `<td class="col-team">
       ${escapeHtml(teamNames.B)}
       </td>`;


    for(let i=0;i<maxCols;i++){

      html +=
        `<td>${escapeHtml(g.B[i] || '')}</td>`;

    }

    html += '</tr>';

  });


  tbody.innerHTML =
    html;

}

  if(total === 0)
    return '0%';

  return Math.round(
    inCount / total * 100
  ) + '%';

      </tr>

      <tr>
        <td>リターンエラー</td>
        <td>${getPairStat('A','returnE')}</td>
        <td>${getPairStat('B','returnE')}</td>
      </tr>

    `;

  }

}


/* =========================================================
   画像保存
========================================================= */

async function saveAsImage(){

  if(typeof html2canvas === 'undefined'){

    alert(
      '画像保存機能の読み込みに失敗しました。' +
      'インターネット接続を確認してください。'
    );

    return;

  }


  const area =
    document.getElementById('export-area');


  /*
   * 現在の画面から
   * 「綺麗な結果表」を専用DOMとして作る
   */

  let html = `

    <div class="export-title">
      テニス試合スタッツ
    </div>

    <div style="text-align:center;margin-bottom:5px;">
      ${escapeHtml(matchDateStr)}
    </div>

    <div class="export-score">
      ${escapeHtml(teamNames.A)}
      ${games.A}
      -
      ${games.B}
      ${escapeHtml(teamNames.B)}
    </div>

    <div style="text-align:center;margin-bottom:15px;">
      ポイント
      ${pointLabel(points.A)}
      -
      ${pointLabel(points.B)}
    </div>

    <div class="export-section-title">
      ゲーム別ポイントログ
    </div>

  `;


  /*
   * ログテーブル
   */

  const logTable =
    document.getElementById('game-log-table');


  html +=
    logTable.outerHTML;


  /*
   * スタッツ
   */

  html += `

    <div class="export-section-title">
      スタッツ集計
    </div>

  `;


  const statsTable =
    document.getElementById('stats-table');


  html +=
    statsTable.outerHTML;


  area.innerHTML =
    html;


  /*
   * sticky指定を画像用に解除
   */

  area
    .querySelectorAll('*')
    .forEach(el=>{

      el.style.position = 'static';

    });


  try{

    const canvas =
      await html2canvas(
        area,
        {
          scale:2,
          backgroundColor:'#ffffff',
          useCORS:true,
          logging:false
        }
      );


    canvas.toBlob(async blob=>{

      if(!blob)
        return;


      const file =
        new File(
          [blob],
          'tennis-stats.png',
          {type:'image/png'}
        );


      /*
       * スマホ対応:
       * Web Share APIが使える場合は共有画面
       */

      if(
        navigator.share &&
        navigator.canShare &&
        navigator.canShare({files:[file]})
      ){

        try{

          await navigator.share({
            title:'テニススタッツ',
            text:'試合スタッツ',
            files:[file]
          });

          return;

        }catch(e){

          /*
           * キャンセル時は何もしない
           */

          if(e.name === 'AbortError')
            return;

        }

      }


      /*
       * 共有非対応の場合は画像を新規タブで開く
       */

      const url =
        URL.createObjectURL(blob);

      const win =
        window.open(url,'_blank');

      if(!win){

        /*
         * ポップアップブロック対策
         */

        const a =
          document.createElement('a');

        a.href = url;
        a.download = 'tennis-stats.png';

        document.body.appendChild(a);

        a.click();

        a.remove();

      }

      setTimeout(
        ()=>URL.revokeObjectURL(url),
        60000
      );

    },'image/png');


  }catch(e){

    console.error(e);

    alert(
      '画像の生成に失敗しました。'
    );

  }

}


/* =========================================================
   HTML Escape
========================================================= */

function escapeHtml(str){

  return String(str)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');

}

</script>
